<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>세차장 천장의 여자 - Horror Cinematic Story</title>
    <style>
      @font-face { font-family: "Apple SD Gothic Neo"; src: local("Apple SD Gothic Neo"); }
      :root {
        --black: #020407;
        --deep: #071318;
        --teal: #10252a;
        --ink: #e8edf0;
        --muted: #8fa1a6;
        --red: #ff334f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        overflow: hidden;
        background: var(--black);
        color: var(--ink);
        font-family: "Apple SD Gothic Neo", Arial, sans-serif;
      }
      #master {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background:
          radial-gradient(circle at 58% 38%, rgba(35, 74, 78, .34), transparent 28%),
          linear-gradient(110deg, #020406 0 24%, #071114 52%, #020305 100%);
      }
      .corridor {
        position: absolute;
        inset: -6%;
        transform-origin: 56% 44%;
        background:
          linear-gradient(96deg, transparent 0 17%, rgba(1, 3, 5, .88) 17% 24%, transparent 24% 73%, rgba(0, 0, 0, .9) 73% 81%, transparent 81%),
          repeating-linear-gradient(90deg, rgba(101, 142, 141, .08) 0 3px, transparent 3px 148px),
          linear-gradient(180deg, rgba(102, 145, 140, .12), transparent 24% 68%, rgba(0, 0, 0, .85));
        filter: contrast(1.16) saturate(.72);
      }
      .ceiling-light {
        position: absolute;
        left: 570px;
        top: 70px;
        width: 780px;
        height: 64px;
        transform: perspective(500px) rotateX(58deg);
        background: linear-gradient(90deg, transparent, rgba(205, 239, 229, .72), transparent);
        filter: blur(10px);
        opacity: .48;
      }
      .door {
        position: absolute;
        right: 255px;
        top: 175px;
        width: 390px;
        height: 720px;
        border: 3px solid rgba(154, 186, 181, .18);
        background: linear-gradient(90deg, #030607, #102024 52%, #040708);
        box-shadow: -60px 0 120px rgba(0, 0, 0, .62), inset 12px 0 35px rgba(114, 158, 154, .08);
      }
      .door::after {
        content: "";
        position: absolute;
        right: 36px;
        top: 355px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: rgba(223, 233, 229, .68);
        box-shadow: 0 0 22px rgba(223, 233, 229, .28);
      }
      .signal {
        position: absolute;
        right: 300px;
        top: 130px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--red);
        box-shadow: 0 0 14px var(--red), 0 0 58px rgba(255, 51, 79, .72);
      }
      .scan {
        position: absolute;
        left: 0;
        right: 0;
        top: -120px;
        height: 110px;
        background: linear-gradient(180deg, transparent, rgba(164, 234, 221, .08), transparent);
        mix-blend-mode: screen;
      }
      .grain {
        position: absolute;
        inset: 0;
        opacity: .12;
        background-image: repeating-linear-gradient(0deg, transparent 0 3px, rgba(255, 255, 255, .035) 3px 4px);
        pointer-events: none;
      }
      .copy {
        position: absolute;
        left: 148px;
        top: 250px;
        width: 980px;
        z-index: 4;
      }
      .kicker {
        margin-bottom: 26px;
        color: #7fb8ad;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: .19em;
      }
      h1 {
        margin: 0;
        max-width: 940px;
        font-size: 76px;
        line-height: 1.16;
        letter-spacing: -.055em;
        word-break: keep-all;
        text-shadow: 0 10px 34px rgba(0, 0, 0, .86);
      }
      h1 b { color: var(--red); }
      .rule {
        width: 0;
        height: 4px;
        margin-top: 42px;
        background: linear-gradient(90deg, var(--red), transparent);
        box-shadow: 0 0 18px rgba(255, 51, 79, .34);
      }
      .motif {
        margin-top: 25px;
        color: var(--muted);
        font-size: 24px;
        font-weight: 700;
        letter-spacing: .04em;
      }
      .caption-safe-guide {
        position: absolute;
        left: 260px;
        right: 260px;
        bottom: 110px;
        display: none;
        text-align: center;
        font-size: 44px;
        font-weight: 700;
        text-shadow: -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000;
      }
    </style>
  </head>
  <body>
    <main id="master" data-composition-id="youtube-master" data-width="1920" data-height="1080" data-start="0" data-duration="8">
      <div class="corridor"></div>
      <div class="ceiling-light"></div>
      <div class="door"></div>
      <div class="signal"></div>
      <div class="scan"></div>
      <div class="grain"></div>
      <section class="copy">
        <div class="kicker">COLD OPEN · horror_cinematic_story_v1</div>
        <h1>체크인한 사람은<br>다섯 명이었습니다.<br><b>그런데 CCTV에는 여섯 명.</b></h1>
        <div class="rule"></div>
        <div class="motif">첫 이상 징후는 30초 안에 시작합니다</div>
      </section>
      <div class="caption-safe-guide">최종 자막은 클린 마스터 승인 후 별도 생성합니다</div>
      <audio id="voice" data-start="0" data-duration="653.760" data-track-index="0" src="assets/audio/voice.wav" data-volume="1"></audio>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const timeline = gsap.timeline({ paused: true });
      timeline
        .from(".kicker", { opacity: 0, y: 14, duration: .42 }, 0)
        .from("h1", { opacity: 0, y: 24, scale: .985, duration: .65 }, .18)
        .to(".rule", { width: 740, duration: .7, ease: "power2.out" }, 1.45)
        .from(".motif", { opacity: 0, y: 10, duration: .45 }, 1.9)
        .fromTo(".corridor", { scale: 1.04, x: -8, y: -4 }, { scale: 1.14, x: 24, y: 10, duration: 8, ease: "none" }, 0)
        .fromTo(".scan", { y: -60 }, { y: 1260, duration: 2.6, repeat: 3, ease: "none" }, 0)
        .to(".ceiling-light", { opacity: .18, duration: .09, repeat: 17, yoyo: true, repeatDelay: .31 }, .45)
        .to(".signal", { scale: 1.55, opacity: .46, duration: .58, repeat: 7, yoyo: true, ease: "sine.inOut" }, .3)
        .to("#master", { filter: "brightness(.78)", duration: .25 }, 7.75);
      window.__timelines["youtube-master"] = timeline;
    </script>
  </body>
</html>
