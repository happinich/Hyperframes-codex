        {id:"S12",tone:"finance",start:358.21,end:393.61,kicker:"Dual Engine",title:"강남과 달러자산\n둘 다 가져가는 전략",sub:"고수익 기대는 금융 43%, 부동산 41%. 개별 항목 1위는 주식 28.5%였습니다.",chips:["금융 43%","부동산 41%","주식 28.5%"],visual:"dual"},
        {id:"S13",tone:"bright",start:393.61,end:424.23,kicker:"Catch Up",title:"강남이 없다면\n강남을 따라잡을 자산부터",sub:"원화 현금만 기다리면 격차가 커집니다. 세계에서 돈을 버는 우량자산을 먼저 모아야 합니다.",chips:["달러 자산","세계 우량","종잣돈"],visual:"road"},
        {id:"S14",tone:"bright",start:424.23,end:452.33,kicker:"Compound",title:"폭락을 피하지 말고\n팔지 않을 구조를 만드십시오",sub:"매달 사고, 흔들릴 때 좋은 가격으로 더 모으고, 수익이 다시 자산을 사게 만듭니다.",chips:["정기 적립","하락 매수","복리"],visual:"compound"},
        {id:"S15",tone:"bright",start:452.33,end:478.83,kicker:"Money Route",title:"주식 수익 → 현금 →\n강남 핵심 부동산",sub:"빨리 불어나는 자산으로 종잣돈을 키우고 쉽게 사라지지 않는 자산으로 부를 잠급니다.",chips:["성장자산","현금 전환","핵심 실물"],visual:"flow"},
        {id:"S16",tone:"bright",start:478.83,end:505.71,kicker:"Survival Structure",title:"약한 자산은 버리고\n강한 자산만 더 강하게",sub:"해외에는 거주권과 달러자산, 한국에는 마지막까지 수요가 남는 핵심 부동산을 둡니다.",chips:["선택권","달러자산","강남 핵심"],visual:"checks"},
        {id:"S17",tone:"bright",start:505.71,end:536.86,kicker:"Final Question",title:"당신의 자산은\n강남보다 빠르게 성장합니까?",sub:"현금만 기다리는 사람과 세계에서 돈을 벌어 핵심 실물로 옮기는 사람. 시간은 둘을 갈라놓습니다.",chips:["성장 속도","자산 전환","시간의 편"],visual:"choice"}
      ];
      function visual(type) {
        if(type==="pressure") return `<div class="visual stat-wall"><div class="card"><div class="label">백만장자 순유출 추정</div><div class="metric red">2,400명</div></div><div class="card"><div class="label">2026 경쟁력 압박</div><div class="metric gold">66.2</div></div><div class="card wide"><div class="label">조용한 이동</div><div class="metric" style="font-size:48px">세금 · 승계 · 규제 · 교육</div></div></div>`;
        if(type==="world") return `<div class="visual machine"><div class="engine">한국<br>핵심<br>실물</div><div class="orbit o1">미국 거주권</div><div class="orbit o2">싱가포르</div><div class="orbit o3">달러자산</div><div class="orbit o4">자녀 교육</div><div class="orbit o5">해외 법인</div></div>`;
        if(type==="tax") return `<div class="visual stat-wall"><div class="card"><div class="label">상속세 법정 최고</div><div class="metric red">50%</div></div><div class="card"><div class="label">기업 지분</div><div class="metric gold">승계</div></div><div class="card wide"><div class="label">생활 기반 이동</div><div class="metric" style="font-size:46px">국외전출세까지 계산</div></div></div>`;
        if(type==="order") return `<div class="visual road"><div class="road-card"><div class="label">먼저 정리</div><div class="metric" style="font-size:52px">인구 감소<br>수요 약화</div><div class="road-line"></div><div class="coin" style="left:54px;bottom:88px;background:var(--red)">↓</div></div><div class="road-card dark"><div class="label">끝까지 보유</div><div class="metric" style="font-size:52px">희소성<br>현금흐름</div><div class="road-line"></div><div class="coin" style="right:72px;bottom:88px">↑</div></div></div>`;
        if(type==="fortress") return `<div class="visual skyline"><div class="scarcity-ring"></div><div class="tower" style="height:220px"></div><div class="tower" style="height:310px"></div><div class="tower" style="height:420px"></div><div class="tower" style="height:500px"></div><div class="tower" style="height:385px"></div><div class="tower" style="height:280px"></div><div class="warning-core" style="position:absolute;width:240px;height:240px;font-size:38px">강남<br>핵심<br>자산</div></div>`;
        if(type==="wealth") return `<div class="visual stat-wall"><div class="card"><div class="label">실제 부동산</div><div class="metric gold">54.8%</div></div><div class="card"><div class="label">실제 금융자산</div><div class="metric blue">37.1%</div></div><div class="card wide"><div class="label">100억 이상이 원하는 부동산 비중</div><div class="metric gold">57.6%</div></div></div>`;
        if(type==="market") return `<div class="visual stat-wall"><div class="card"><div class="label">강남3구 공시가격</div><div class="metric red">24.7%</div></div><div class="card"><div class="label">서울 평균 주택가격</div><div class="metric gold">10억+</div></div><div class="card wide"><div class="label">서울 아파트값</div><div class="metric">73주 연속 상승</div></div></div>`;
        if(type==="scarcity") return `<div class="visual skyline"><div class="scarcity-ring"></div><div class="tower" style="height:180px"></div><div class="tower" style="height:260px"></div><div class="tower" style="height:340px"></div><div class="tower" style="height:450px"></div><div class="tower" style="height:370px"></div><div class="tower" style="height:290px"></div><div class="tower" style="height:210px"></div><div class="card" style="position:absolute;top:20px;right:20px;padding:24px 34px"><div class="label">새 땅</div><div class="metric red" style="font-size:54px">0</div></div></div>`;
        if(type==="use") return `<div class="visual machine"><div class="engine">강남<br>사용<br>가치</div><div class="orbit o1">직접 거주</div><div class="orbit o2">전세·월세</div><div class="orbit o3">교육</div><div class="orbit o4">직장·교통</div><div class="orbit o5">재건축</div></div>`;
        if(type==="dual") return `<div class="visual compare-assets"><div class="card asset-card"><div><div class="label">강남 핵심 실물</div><div class="metric gold">41%</div></div><div class="mini-map"><div class="pin"></div></div></div><div class="vs">+</div><div class="card asset-card"><div><div class="label">달러 금융자산</div><div class="metric blue">43%</div></div><div class="mini-world"><div class="flow-lines"></div></div></div></div>`;
        if(type==="flow") return `<div class="visual flow-track"><div class="flow-node"><strong class="blue">주식 수익</strong><span>빠르게 불리는 자산</span></div><div class="flow-node"><strong class="gold">현금</strong><span>움직일 수 있는 힘</span></div><div class="flow-node"><strong class="mint">강남 핵심</strong><span>부를 잠그는 실물</span></div></div>`;
        if(type==="warning") return `<div class="visual warning"><div class="warning-ring"></div><div class="warning-core">마지막<br>자산<br>강남</div><div class="ladder"><i></i><i></i><i></i><i></i></div></div>`;
        if(type==="cash") return `<div class="visual cash-market"><div class="card"><div class="label">집값 단위</div><div class="metric red">수십억</div></div><div class="card"><div class="label">대출 환경</div><div class="metric gold">제한</div></div><div class="card cash"><div class="label">핵심지 진입권</div><div class="metric">현금</div></div></div>`;
        if(type==="road") return `<div class="visual road"><div class="road-card"><div class="label">왼쪽 길</div><div class="metric">원화<br>자산</div><div class="road-line"></div><div class="coin" style="left:54px;bottom:88px">₩</div></div><div class="road-card dark"><div class="label">오른쪽 길</div><div class="metric">달러<br>자산</div><div class="road-line"></div><div class="coin" style="right:72px;bottom:88px">$</div></div></div>`;
        if(type==="chart") return `<div class="visual chart-compare"><div class="card"><div><div class="label">원화 기준 숫자</div><div class="metric mint">상승처럼<br>보임</div></div><svg class="trend" viewBox="0 0 620 250"><path style="stroke:#24c7b5" d="M8 210 C120 190 180 185 260 145 S430 118 612 48"/></svg></div><div class="card"><div><div class="label">달러 기준 구매력</div><div class="metric red">따로<br>봐야 함</div></div><svg class="trend" viewBox="0 0 620 250"><path style="stroke:#ff5f70" d="M8 70 C130 95 188 86 270 130 S445 176 612 190"/></svg></div></div>`;
        if(type==="machine") return `<div class="visual machine"><div class="engine">미국<br>자산<br>엔진</div><div class="orbit o1">AI</div><div class="orbit o2">반도체</div><div class="orbit o3">클라우드</div><div class="orbit o4">데이터센터</div><div class="orbit o5">빅테크</div></div>`;
        if(type==="compare") return `<div class="visual compare-assets"><div class="card asset-card"><div><div class="label">강남 부동산</div><div class="metric gold">희소성</div></div><div class="mini-map"><div class="pin"></div></div></div><div class="vs">=</div><div class="card asset-card"><div><div class="label">미국 우량주</div><div class="metric blue">세계 자본</div></div><div class="mini-world"><div class="flow-lines"></div></div></div></div>`;
        if(type==="crash") return `<div class="visual crash"><div class="card"><div class="label">가난한 사람의 시선</div><div class="metric red">끝났다</div><svg class="fall-line" viewBox="0 0 460 230"><path d="M20 40 C110 75 145 65 210 120 S330 170 440 205"/></svg></div><div class="card"><div class="label">부자의 시선</div><div class="opportunity">SALE</div><div class="metric green" style="font-size:44px;margin-top:25px">싸게 살 시간</div></div></div>`;
        if(type==="compound") return `<div class="visual compound"><div class="steps"><div class="step" style="height:150px">1억<span>시작</span></div><div class="step" style="height:230px">2억<span>축적</span></div><div class="step" style="height:320px">5억<span>복리</span></div><div class="step" style="height:420px">10억+<span>방향</span></div></div></div>`;
        if(type==="checks") return `<div class="visual checklist"><div class="card check"><i>1</i><strong>달러 기준</strong><span>원화 숫자보다 구매력</span></div><div class="card check"><i>2</i><strong>세계 1등</strong><span>작은 테마보다 지배력</span></div><div class="card check"><i>3</i><strong>10년</strong><span>3개월 수익률보다 시간</span></div></div>`;
        if(type==="gap") return `<div class="visual gap"><div class="gap-line"><div class="person a">원화 현금<br>단타 반복</div><div class="gap-arrow"></div><div class="person b">달러 자산<br>방향 전환</div></div></div>`;
        return `<div class="visual final-choice"><div class="card choice"><strong>현금만 기다림</strong><span>시간에 뒤처지는 사람</span></div><div class="card choice good"><strong>세계 자산 → 강남</strong><span>시간을 자기 편으로 만드는 사람</span></div></div>`;
      }
      document.getElementById("scenes").innerHTML = scenes.map(s => {
        const compact = s.title.replace(/\s/g, "").length > 17 ? "compact" : "";
        return `<section class="scene ${s.tone}" id="${s.id}"><div class="scene-motion"></div><div class="panel two"><div><div class="kicker">${s.kicker}</div><h1 class="${compact}">${s.title.replace(/\n/g,"<br>")}</h1><p class="sub">${s.sub}</p><div class="chips">${s.chips.map(c=>`<span class="chip">${c}</span>`).join("")}</div></div>${visual(s.visual)}</div></section>`;
      }).join("");
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      function exists(q){ return document.querySelector(q); }
      function to(q,v,t){ if(exists(q)) tl.to(q,v,t); }
      function fromTo(q,a,b,t){ if(exists(q)) tl.fromTo(q,a,b,t); }
      tl.to(".grid",{backgroundPosition:"700px 420px",duration:DURATION,ease:"none"},0);
      tl.to(".glow.a",{x:1400,y:520,scale:1.35,duration:DURATION,ease:"none"},0);
      tl.to(".glow.b",{x:-1350,y:-520,rotation:360,duration:DURATION,ease:"none"},0);
      tl.fromTo(".ribbon",{x:-200},{x:8500,duration:DURATION,ease:"none"},0);
      tl.fromTo(".sweep",{x:0},{x:2860,duration:2,repeat:220,ease:"none"},0);
      tl.fromTo(".progress-fill",{scaleX:0},{scaleX:1,duration:DURATION,ease:"none"},0);
      scenes.forEach(s => {
        const d = s.end - s.start;
        const q = `#${s.id}`;
        tl.set(q,{autoAlpha:1},s.start);
        fromTo(`${q} .scene-motion`,{x:-260,y:-90},{x:420,y:130,duration:d,ease:"none"},s.start);
        fromTo(`${q} .panel`,{y:28,scale:.992},{y:0,scale:1,duration:.48,ease:"power3.out"},s.start);
        fromTo(`${q} h1`,{y:25,opacity:0},{y:0,opacity:1,duration:.45,ease:"power3.out"},s.start+.05);
        fromTo(`${q} .sub`,{y:15,opacity:0},{y:0,opacity:1,duration:.4,ease:"power2.out"},s.start+.15);
        fromTo(`${q} .visual`,{x:22,opacity:0},{x:0,opacity:1,duration:.32,ease:"power3.out"},s.start+.02);
        fromTo(`${q} .chip`,{y:15,opacity:0},{y:0,opacity:1,stagger:.07,duration:.42,ease:"power2.out"},s.start+.24);
        to(`${q} .visual`,{y:-18,duration:Math.max(d-.7,.5),ease:"none"},s.start+.35);
        to(`${q} .card`,{y:-10,yoyo:true,repeat:Math.max(1,Math.floor(d/3)),duration:1.5,stagger:.14,ease:"sine.inOut"},s.start+.55);
        to(`${q} .metric`,{scale:1.055,yoyo:true,repeat:Math.max(1,Math.floor(d/3)),duration:1.45,ease:"sine.inOut"},s.start+.6);
        fromTo(`${q} .warning-ring`,{scale:.45,opacity:.9},{scale:1.7,opacity:0,repeat:Math.max(2,Math.floor(d/2)),duration:1.7,ease:"power1.out"},s.start+.25);
        to(`${q} .warning-core`,{scale:1.04,yoyo:true,repeat:Math.max(2,Math.floor(d/2.2)),duration:1.1,ease:"sine.inOut"},s.start+.5);
        fromTo(`${q} .ladder i`,{x:170,opacity:0},{x:0,opacity:.8,duration:.55,stagger:.16,ease:"power2.out"},s.start+.65);
        to(`${q} .ladder`,{x:-40,y:-20,duration:Math.max(d-1,1),ease:"none"},s.start+1);
        fromTo(`${q} .cash-market .card`,{scale:.82,opacity:0},{scale:1,opacity:1,duration:.55,stagger:.18,ease:"back.out(1.5)"},s.start+.45);
        fromTo(`${q} .stat-wall .card`,{y:36,scale:.88,opacity:0},{y:0,scale:1,opacity:1,duration:.58,stagger:.2,ease:"back.out(1.4)"},s.start+.35);
        to(`${q} .stat-wall .wide`,{scale:1.025,yoyo:true,repeat:Math.max(1,Math.floor(d/3)),duration:1.45,ease:"sine.inOut"},s.start+1.4);
        to(`${q} .cash`,{scale:1.035,yoyo:true,repeat:Math.max(1,Math.floor(d/2.4)),duration:1.2,ease:"sine.inOut"},s.start+1.4);
        fromTo(`${q} .road-line`,{scaleX:.08},{scaleX:1,duration:1.4,stagger:.2,ease:"power2.out",transformOrigin:"left"},s.start+.55);
        to(`${q} .coin`,{x:(i)=>i?90:210,rotation:360,yoyo:true,repeat:Math.max(1,Math.floor(d/2.6)),duration:1.3,ease:"sine.inOut"},s.start+1.1);
        fromTo(`${q} .trend path`,{strokeDasharray:900,strokeDashoffset:900},{strokeDashoffset:0,duration:2.2,stagger:.15,ease:"power2.out"},s.start+.55);
        to(`${q} .engine`,{scale:1.055,yoyo:true,repeat:Math.max(2,Math.floor(d/2.4)),duration:1.2,ease:"sine.inOut"},s.start+.6);
        to(`${q} .orbit`,{y:(i)=>i%2?-18:18,x:(i)=>i%2?12:-12,yoyo:true,repeat:Math.max(1,Math.floor(d/2.2)),duration:1.1,stagger:.1,ease:"sine.inOut"},s.start+.55);
        fromTo(`${q} .tower`,{scaleY:.04,opacity:.2},{scaleY:1,opacity:1,duration:1.2,stagger:.12,ease:"back.out(1.25)"},s.start+.45);
        to(`${q} .tower`,{y:(i)=>i%2?-14:-6,yoyo:true,repeat:Math.max(1,Math.floor(d/2.5)),duration:1.2,stagger:.09,ease:"sine.inOut"},s.start+2.1);
        fromTo(`${q} .scarcity-ring`,{scale:.55,opacity:.8},{scale:1.35,opacity:.08,repeat:Math.max(2,Math.floor(d/2.6)),duration:1.3,ease:"power1.out"},s.start+.6);
        fromTo(`${q} .pin`,{scale:.45,opacity:.65},{scale:1.9,opacity:0,repeat:Math.max(2,Math.floor(d/2)),duration:1.8,ease:"power1.out"},s.start+.55);
        to(`${q} .flow-lines`,{backgroundPosition:"360px 0",duration:8,repeat:Math.max(1,Math.floor(d/8)),ease:"none"},s.start+.5);
        fromTo(`${q} .fall-line path`,{strokeDasharray:900,strokeDashoffset:900},{strokeDashoffset:0,duration:2,ease:"power2.out"},s.start+.55);
        to(`${q} .opportunity`,{scale:1.08,yoyo:true,repeat:Math.max(1,Math.floor(d/2)),duration:1,ease:"sine.inOut"},s.start+1);
        fromTo(`${q} .step`,{scaleY:.05},{scaleY:1,duration:1.35,stagger:.22,ease:"back.out(1.25)"},s.start+.55);
        to(`${q} .step`,{y:(i)=>i%2?-12:-7,yoyo:true,repeat:Math.max(1,Math.floor(d/2.4)),duration:1.2,stagger:.12,ease:"sine.inOut"},s.start+2.2);
        fromTo(`${q} .check`,{y:28,opacity:0},{y:0,opacity:1,stagger:.28,duration:.6,ease:"back.out(1.3)"},s.start+.55);
        to(`${q} .check i`,{scale:1.16,yoyo:true,repeat:Math.max(1,Math.floor(d/2.8)),duration:.75,stagger:.18,ease:"sine.inOut"},s.start+2.2);
        fromTo(`${q} .gap-arrow`,{scaleX:.05},{scaleX:1,duration:1.4,ease:"power2.out"},s.start+.65);
        to(`${q} .person`,{y:(i)=>i?-16:12,yoyo:true,repeat:Math.max(1,Math.floor(d/2.3)),duration:1.1,stagger:.2,ease:"sine.inOut"},s.start+1);
        fromTo(`${q} .choice`,{y:36,opacity:0},{y:0,opacity:1,duration:.55,stagger:.22,ease:"back.out(1.35)"},s.start+.5);
        to(`${q} .choice.good`,{scale:1.035,yoyo:true,repeat:Math.max(2,Math.floor(d/1.8)),duration:.9,ease:"sine.inOut"},s.start+1.2);
        fromTo(`${q} .flow-track::before`,{scaleX:.05},{scaleX:1,duration:1.4,ease:"power2.out",transformOrigin:"left"},s.start+.5);
        fromTo(`${q} .flow-node`,{x:-35,opacity:0},{x:0,opacity:1,duration:.55,stagger:.35,ease:"back.out(1.3)"},s.start+.45);
        to(`${q} .flow-node`,{y:(i)=>i%2?-14:8,yoyo:true,repeat:Math.max(1,Math.floor(d/2.4)),duration:1.2,stagger:.12,ease:"sine.inOut"},s.start+2);
        tl.to(q,{autoAlpha:0,duration:.32,ease:"power2.in"},Math.max(s.end-.32,s.start+.2));
      });
      window.__timelines["youtube-master"] = tl;
    </script>
