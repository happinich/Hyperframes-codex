<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>027 쇼츠 게시 전략</title><style>*{box-sizing:border-box}body{margin:0;background:#101410;color:#ebece4;font:16px/1.6 system-ui,sans-serif}main{max-width:1040px;margin:auto;padding:28px 20px 70px}h1{font-size:30px;line-height:1.35}h2{font-size:21px;margin:0}section{background:#1b211c;border:1px solid #374138;border-radius:13px;padding:20px;margin:18px 0}textarea{display:block;width:100%;min-height:100px;resize:vertical;border:1px solid #536052;border-radius:8px;background:#121812;color:#f2f2e8;padding:14px;font:16px/1.6 system-ui;margin-top:12px}button,a.button{cursor:pointer;background:#d4dac7;color:#101510;border:0;border-radius:7px;padding:10px 15px;display:inline-block;text-decoration:none;font:inherit;margin:9px 8px 0 0}button:focus-visible,a:focus-visible{outline:3px solid #ccad6b}.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:15px}img{width:100%;height:auto;border-radius:8px}video{max-width:100%;max-height:660px;background:#101410;border-radius:8px}.note{color:#c4cbbc}.status{min-height:25px;color:#d6d3af}nav{display:flex;gap:12px;flex-wrap:wrap}li{margin:6px 0}@media(max-width:650px){.thumbs{grid-template-columns:1fr}h1{font-size:24px}main{padding:18px 13px}}</style></head><body><main><h1>쇼츠 3편 게시 전략</h1><section><h2>1. 물이 없는 저수조에서 누가 헤엄쳤다</h2><p>본편 공개 다음 날 20:30 KST</p><a class="button" href="shorts-01-publish.html">영상과 게시 전략 열기</a></section><section><h2>2. 울타리 밖의 몸이 접히기 시작했다</h2><p>본편 공개 2일 후 20:30 KST</p><a class="button" href="shorts-02-publish.html">영상과 게시 전략 열기</a></section><section><h2>3. 배달된 문 뒤에서 의자가 끌렸다</h2><p>본편 공개 3일 후 20:30 KST</p><a class="button" href="shorts-03-publish.html">영상과 게시 전략 열기</a></section></main><script>document.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',async()=>{const t=document.getElementById(b.dataset.copy),s=b.parentElement.querySelector('.status');try{await navigator.clipboard.writeText(t.value);s.textContent='복사했습니다.';}catch(e){t.focus();t.select();const ok=document.execCommand('copy');s.textContent=ok?'복사했습니다.':'텍스트를 선택했습니다. 복사 단축키로 복사해 주세요.';}}));</script></body></html>
