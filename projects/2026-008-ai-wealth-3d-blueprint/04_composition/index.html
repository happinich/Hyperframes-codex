}

window.__timelines=window.__timelines||{};const tl=gsap.timeline({paused:true});
tl.to('.orb.a',{x:1450,y:520,scale:1.25,duration:DURATION,ease:'none'},0).to('.orb.b',{x:-1450,y:-500,rotation:360,duration:DURATION,ease:'none'},0).fromTo('.scan',{x:0},{x:2820,duration:2.8,repeat:Math.max(0,Math.floor(DURATION/2.8)-1),ease:'none'},0).fromTo('.progressFill',{scaleX:0},{scaleX:1,duration:DURATION,ease:'none'},0);
scenes.forEach(s=>{const q='#'+s.id,d=s.end-s.start,r=Math.max(2,Math.floor(d/2.5));tl.set(q,{autoAlpha:1},s.start).fromTo(q+' .panel',{y:36,scale:.992},{y:0,scale:1,duration:.48,ease:'power3.out'},s.start).fromTo(q+' h1',{y:24,opacity:0},{y:0,opacity:1,duration:.42,ease:'power3.out'},s.start+.04).fromTo(q+' .sub',{y:18,opacity:0},{y:0,opacity:1,duration:.4},s.start+.18).fromTo(q+' .chip',{y:15,opacity:0},{y:0,opacity:1,duration:.35,stagger:.07},s.start+.34).fromTo(q+' .visual',{x:35,opacity:0},{x:0,opacity:1,duration:.38,ease:'power3.out'},s.start+.02).to(q+' .visual',{y:-18,duration:Math.max(.5,d-.8),ease:'none'},s.start+.4).to(q+' .card',{y:-12,yoyo:true,repeat:r,duration:1.25,stagger:.12,ease:'sine.inOut'},s.start+.8).to(q+' .node',{scale:1.045,yoyo:true,repeat:r,duration:1.15,stagger:.1,ease:'sine.inOut'},s.start+.65).fromTo(q+' .line',{scaleX:0},{scaleX:1,duration:1.1,stagger:.22,ease:'power2.out'},s.start+.45).to(q+' .ring',{scale:1.6,opacity:.05,repeat:r,duration:1.45,ease:'power1.out'},s.start+.3).to(q+' .target',{boxShadow:'0 0 70px rgba(255,77,95,.72)',scale:1.06,yoyo:true,repeat:r,duration:.9},s.start+.8).to(q+' .cloud',{scale:1.06,yoyo:true,repeat:r,duration:1.2,ease:'sine.inOut'},s.start+.6).to(q+' .trace',{boxShadow:'0 0 34px #27e7ff',scaleX:1.08,yoyo:true,repeat:r,duration:.9,stagger:.15},s.start+.8).fromTo(q+' .fill',{scaleX:.08},{scaleX:1,duration:1.7,stagger:.28,ease:'power2.out'},s.start+.6).to(q+' .deal',{scale:1.08,yoyo:true,repeat:r,duration:1.1},s.start+2).to(q+' .particle',{x:520,repeat:r,duration:1.25,ease:'power1.inOut'},s.start+.7).fromTo(q+' .sharefill',{scaleX:.08},{scaleX:1,duration:1.5,stagger:.35,ease:'power2.out',transformOrigin:'left'},s.start+.6).to(q+' .moat',{rotation:360,duration:Math.max(5,d-1),ease:'none'},s.start+.5).fromTo(q+' .drop',{scaleX:0},{scaleX:1,duration:1.2,ease:'power2.out'},s.start+.7).to(q+' .needle',{rotation:38,yoyo:true,repeat:r,duration:1.2,ease:'sine.inOut'},s.start+1).fromTo(q+' .mapNode',{y:30,opacity:0},{y:0,opacity:1,duration:.4,stagger:.18},s.start+2).to(q,{autoAlpha:0,duration:.35},Math.max(s.start,s.end-.35));});
tl.duration(DURATION);window.__timelines['youtube-master']=tl;
