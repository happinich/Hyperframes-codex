<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>텐트 밖의 목소리 · Shorts</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script><script src="shorts-transcript-data.js"></script>
  <style>
    @font-face{font-family:AppleSD;src:local("Apple SD Gothic Neo")}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010305;font-family:AppleSD,Arial,sans-serif}
    #shorts{position:relative;width:1080px;height:1920px;overflow:hidden;color:#f3f7f7;background:#010305}.scene{position:absolute;inset:0;visibility:hidden;opacity:0;overflow:hidden;background:#010305}.scene:first-of-type{visibility:visible;opacity:1}
    .image{position:absolute;inset:-100px;background-size:cover;background-position:center;filter:saturate(.72) contrast(1.18) brightness(.68);transform:scale(1.08)}.s1 .image,.s2 .image,.s3 .image{background-position:52% center}.s4 .image,.s5 .image{background-position:53% center}.s6 .image{background-position:48% center}
    .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(1,3,5,.92) 0%,rgba(1,3,5,.12) 25%,rgba(1,3,5,.2) 64%,rgba(1,3,5,.96) 91%)}.vignette{position:absolute;inset:0;box-shadow:inset 0 0 210px 55px rgba(0,0,0,.94)}
    .rain{position:absolute;inset:-180px;opacity:.2;background:repeating-linear-gradient(113deg,transparent 0 22px,rgba(220,246,244,.2) 23px 24px,transparent 25px 50px)}.scan{position:absolute;z-index:5;left:0;right:0;top:-20px;height:4px;background:linear-gradient(90deg,transparent,#70d9d1,transparent);opacity:0;box-shadow:0 0 22px #70d9d1}
    .eyebrow{position:absolute;z-index:10;left:70px;top:110px;font-size:27px;font-weight:900;letter-spacing:.22em;color:#72d9d1}.headline{position:absolute;z-index:10;left:70px;right:70px;top:175px;font-size:70px;line-height:1.14;font-weight:900;letter-spacing:-.045em;text-shadow:0 6px 28px #000}.headline em{font-style:normal;color:#ff334f}
    .target{position:absolute;z-index:8;left:210px;top:570px;width:660px;height:660px;border:5px solid rgba(255,51,79,.66);border-radius:50%;box-shadow:0 0 60px rgba(255,51,79,.28)}.wave{position:absolute;z-index:8;left:120px;right:120px;top:775px;height:100px;display:flex;align-items:center;justify-content:center;gap:7px}.wave i{width:7px;height:56px;background:linear-gradient(#ff334f,#72d9d1);border-radius:6px;transform-origin:center}
    .caption-wrap{position:absolute;z-index:20;left:62px;right:62px;bottom:260px;min-height:160px;display:flex;align-items:center;justify-content:center;text-align:center}.caption{max-width:950px;font-size:49px;line-height:1.34;font-weight:850;letter-spacing:-.035em;color:#fff;-webkit-text-stroke:5px #000;paint-order:stroke fill;text-shadow:0 5px 12px #000}
    .progress{position:absolute;z-index:22;left:70px;right:70px;bottom:170px;height:6px;background:rgba(255,255,255,.18);border-radius:6px;overflow:hidden}.progress i{display:block;width:0;height:100%;background:#ff334f;box-shadow:0 0 16px #ff334f}.cta{position:absolute;z-index:23;left:70px;right:70px;bottom:105px;text-align:center;font-size:27px;font-weight:800;color:rgba(255,255,255,.7)}
  </style>
</head>
<body>
  <div id="shorts" data-composition-id="shorts-master" data-start="0" data-width="1080" data-height="1920" data-duration="22.358">
    <audio id="shorts-audio" data-start="0" data-duration="22.358" data-track-index="0" src="assets/audio/shorts-summary.wav" data-volume="1"></audio>
    <div class="scene s1"><div class="image" style="background-image:url('assets/visuals/tent-shadow.png')"></div><div class="shade"></div><div class="rain"></div><div class="vignette"></div><div class="scan"></div></div>
    <div class="scene s2"><div class="image" style="background-image:url('assets/visuals/tent-shadow.png')"></div><div class="shade"></div><div class="rain"></div><div class="vignette"></div><div class="scan"></div><div class="wave"></div></div>
    <div class="scene s3"><div class="image" style="background-image:url('assets/visuals/tent-tear.png')"></div><div class="shade"></div><div class="rain"></div><div class="vignette"></div><div class="scan"></div></div>
    <div class="scene s4"><div class="image" style="background-image:url('assets/visuals/long-fingers.png')"></div><div class="shade"></div><div class="rain"></div><div class="vignette"></div><div class="scan"></div><div class="target"></div></div>
    <div class="scene s5"><div class="image" style="background-image:url('assets/visuals/long-fingers.png')"></div><div class="shade"></div><div class="rain"></div><div class="vignette"></div><div class="scan"></div><div class="target"></div></div>
    <div class="scene s6"><div class="image" style="background-image:url('assets/visuals/tent-tear.png')"></div><div class="shade"></div><div class="rain"></div><div class="vignette"></div><div class="scan"></div><div class="wave"></div></div>
    <div class="eyebrow">산속 캠핑장 · 새벽</div><div class="headline"></div><div class="caption-wrap"><div class="caption"></div></div><div class="progress"><i></i></div><div class="cta">전체 이야기는 관련 영상에서</div>
  </div>
  <script>
    const duration=22.358,bars=()=>Array.from({length:40},(_,i)=>`<i style="height:${24+(i*27)%70}px"></i>`).join("");document.querySelectorAll(".wave").forEach(n=>n.innerHTML=bars());
    const scenes=[[".s1",0,2.54,"내 옆에서 자고 있는데"],[".s2",2.54,6.4,"밖에서도 <em>같은 목소리</em>"],[".s3",6.4,9.98,"“지퍼 좀 열어”"],[".s4",9.98,13.14,"텐트 바닥 <em>아래에서</em>"],[".s5",13.14,16.6,"손가락이 <em>여섯 개</em>였다"],[".s6",16.6,duration,"이번에는 <em>내 목소리</em>였다"]];
    const tl=gsap.timeline({paused:true,defaults:{ease:"power2.out"}});window.__timelines=window.__timelines||{};window.__timelines["shorts-master"]=tl;
    scenes.forEach(([sel,start,end,title],index)=>{const el=document.querySelector(sel),img=el.querySelector(".image"),scan=el.querySelector(".scan");tl.set(el,{visibility:"visible",autoAlpha:1},start).set(".headline",{innerHTML:title},start);if(index===0)tl.set(".headline",{autoAlpha:1,y:0},start);else tl.fromTo(".headline",{autoAlpha:0,y:18},{autoAlpha:1,y:0,duration:.3},start);tl.fromTo(img,{scale:1.08,x:index%2?-24:24,y:index%3?0:-18,filter:"saturate(.66) contrast(1.2) brightness(.67)"},{scale:1.22,x:index%2?24:-24,y:index%3?-14:18,filter:"saturate(.9) contrast(1.08) brightness(.87)",duration:end-start,ease:"none"},start);tl.fromTo(el.querySelector(".rain"),{y:-120,x:0},{y:210,x:-35,duration:1.7,repeat:Math.ceil((end-start)/1.7),ease:"none"},start);for(let beat=start+.2;beat<end;beat+=1.7)tl.fromTo(scan,{autoAlpha:0,y:0},{autoAlpha:.55,y:1930,duration:1.05,ease:"none"},beat);if(index<scenes.length-1)tl.to(el,{autoAlpha:0,duration:.24},end-.22).set(el,{visibility:"hidden"},end)});
    document.querySelectorAll(".wave i").forEach((b,i)=>tl.fromTo(b,{scaleY:.15,autoAlpha:.25},{scaleY:1,autoAlpha:1,duration:.14,yoyo:true,repeat:70},2.7+(i%9)*.03));document.querySelectorAll(".target").forEach((n,i)=>tl.fromTo(n,{scale:.72,autoAlpha:.15},{scale:1.08,autoAlpha:.9,duration:1.1,yoyo:true,repeat:5},10.2+i*2.8));
    tl.fromTo(".progress i",{width:"0%"},{width:"100%",duration,ease:"none"},0);(window.HF_CAPTIONS?.cues||[]).forEach(c=>{tl.set(".caption",{innerText:c.text,autoAlpha:1},c.start);tl.set(".caption",{autoAlpha:0},Math.min(duration,c.end+.03))});
  </script>
</body>
</html>
