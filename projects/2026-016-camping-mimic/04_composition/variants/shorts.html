<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>텐트 안에도, 밖에도 · Shorts V2</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="shorts-transcript-data.js"></script>
  <style>
    @font-face{font-family:AppleSD;src:local("Apple SD Gothic Neo")}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010305;font-family:AppleSD,Arial,sans-serif}
    #shorts{position:relative;width:1080px;height:1920px;overflow:hidden;color:#fff;background:#010305}
    .scene{position:absolute;inset:0;visibility:hidden;opacity:0;overflow:hidden;background:#010305}.scene:first-of-type{visibility:visible;opacity:1}
    .image{position:absolute;inset:-90px;background-position:center;background-size:cover;filter:saturate(.72) contrast(1.14) brightness(.7);transform:scale(1.08)}
    .s1 .image,.s2 .image{background-position:center}.s3 .image{background-position:52% 48%}.s4 .image,.s5 .image{background-position:center}
    .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,2,5,.9),rgba(0,2,5,.06) 28%,rgba(0,2,5,.12) 62%,rgba(0,2,5,.94) 91%)}.s1 .shade{background:linear-gradient(180deg,rgba(0,2,5,.76),rgba(0,2,5,.02) 31%,rgba(0,2,5,.08) 64%,rgba(0,2,5,.9) 92%)}
    .vignette{position:absolute;inset:0;box-shadow:inset 0 0 190px 48px rgba(0,0,0,.9)}
    .rain{position:absolute;inset:-180px;opacity:.18;background:repeating-linear-gradient(108deg,transparent 0 25px,rgba(205,241,242,.23) 26px 27px,transparent 28px 55px)}
    .headline{position:absolute;z-index:20;left:66px;right:66px;top:108px;font-size:76px;line-height:1.08;font-weight:950;letter-spacing:-.05em;text-shadow:0 7px 30px #000}
    .headline em{font-style:normal;color:#ff334f}.kicker{position:absolute;z-index:20;left:70px;top:64px;font-size:25px;font-weight:900;letter-spacing:.22em;color:#79ddd4}
    .clue{position:absolute;z-index:16;padding:13px 23px;border:2px solid rgba(255,255,255,.72);border-radius:999px;background:rgba(2,6,9,.76);font-size:29px;font-weight:900;box-shadow:0 8px 28px rgba(0,0,0,.5)}
    .inside{left:92px;top:1120px}.outside{right:92px;top:700px;border-color:#ff5a70;color:#ff8798}.clue-line{position:absolute;z-index:15;left:50%;top:680px;width:4px;height:500px;background:linear-gradient(#ff334f,transparent);transform:rotate(17deg);transform-origin:top}
    .quote{position:absolute;z-index:18;left:95px;right:95px;top:650px;padding:38px 44px;border-left:8px solid #ff334f;background:rgba(1,4,7,.8);font-size:58px;line-height:1.25;font-weight:900;letter-spacing:-.04em;box-shadow:0 20px 50px rgba(0,0,0,.55)}
    .wave{position:absolute;z-index:17;left:100px;right:100px;top:890px;height:130px;display:flex;align-items:center;justify-content:center;gap:8px}.wave i{width:8px;height:70px;border-radius:8px;background:linear-gradient(#ff334f,#72d9d1);transform-origin:center}
    .count-ring{position:absolute;z-index:16;left:50%;top:820px;width:540px;height:540px;margin-left:-270px;border:6px solid rgba(255,51,79,.66);border-radius:50%;box-shadow:0 0 60px rgba(255,51,79,.28)}
    .count{position:absolute;z-index:17;left:0;right:0;top:720px;text-align:center;font-size:180px;line-height:1;font-weight:950;color:#ff334f;text-shadow:0 10px 45px #000}
    .echo{position:absolute;z-index:15;left:75px;right:75px;top:650px;text-align:center;font-size:92px;font-weight:950;letter-spacing:-.05em;color:rgba(255,255,255,.08);text-shadow:0 0 45px rgba(255,51,79,.4)}
    .road-alert{position:absolute;z-index:17;left:70px;right:70px;top:620px;text-align:center;font-size:36px;font-weight:900;letter-spacing:.08em;color:#ff657b}
    .caption-wrap{position:absolute;z-index:30;left:58px;right:58px;bottom:215px;min-height:154px;display:flex;align-items:center;justify-content:center;text-align:center}.caption{max-width:950px;font-size:48px;line-height:1.32;font-weight:900;letter-spacing:-.035em;color:#fff;-webkit-text-stroke:5px #000;paint-order:stroke fill;text-shadow:0 5px 13px #000}
    .progress{position:absolute;z-index:32;left:66px;right:66px;bottom:150px;height:7px;background:rgba(255,255,255,.16);border-radius:8px;overflow:hidden}.progress i{display:block;width:0;height:100%;background:#ff334f;box-shadow:0 0 18px #ff334f}.flash{position:absolute;z-index:40;inset:0;background:#dff;opacity:0;pointer-events:none}
  </style>
</head>
<body>
  <div id="shorts" data-composition-id="shorts-master" data-start="0" data-width="1080" data-height="1920" data-duration="21.529">
    <audio id="shorts-audio" data-start="0" data-duration="21.529" data-track-index="0" src="assets/audio/shorts-summary.wav" data-volume="1"></audio>
    <div class="scene s1"><div class="image" style="background-image:url('assets/visuals/shorts-v2-double-friend.png')"></div><div class="shade"></div><div class="rain"></div><div class="vignette"></div><div class="clue inside">텐트 안</div><div class="clue outside">텐트 밖</div><div class="clue-line"></div></div>
    <div class="scene s2"><div class="image" style="background-image:url('assets/visuals/shorts-v2-double-friend.png')"></div><div class="shade"></div><div class="rain"></div><div class="vignette"></div><div class="quote">“지퍼 열어.<br>내 뒤에 뭐가 있어.”</div><div class="wave"></div></div>
    <div class="scene s3"><div class="image" style="background-image:url('assets/visuals/shorts-v2-six-fingers.png')"></div><div class="shade"></div><div class="vignette"></div><div class="count-ring"></div><div class="count">6</div></div>
    <div class="scene s4"><div class="image" style="background-image:url('assets/visuals/shorts-v2-double-friend.png')"></div><div class="shade"></div><div class="rain"></div><div class="vignette"></div><div class="echo">내 목소리</div><div class="wave"></div></div>
    <div class="scene s5"><div class="image" style="background-image:url('assets/visuals/shorts-v2-followed-road.png')"></div><div class="shade"></div><div class="rain"></div><div class="vignette"></div><div class="road-alert">산을 빠져나온 뒤</div></div>
    <div class="kicker">CAMPING HORROR</div><div class="headline">안에도 친구,<br><em>밖에도 친구</em></div><div class="caption-wrap"><div class="caption"></div></div><div class="progress"><i></i></div><div class="flash"></div>
  </div>
  <script>
    const duration=21.529;const waveBars=()=>Array.from({length:42},(_,i)=>`<i style="height:${24+(i*31)%92}px"></i>`).join("");document.querySelectorAll(".wave").forEach(node=>node.innerHTML=waveBars());
    const scenes=[[".s1",0,4.84,"안에도 친구,<br><em>밖에도 친구</em>"],[".s2",4.84,8.24,"밖에서 들린<br><em>같은 목소리</em>"],[".s3",8.24,13.32,"대답하지 않자<br><em>올라온 것</em>"],[".s4",13.32,17.36,"이번에는<br><em>내 목소리</em>"],[".s5",17.36,duration,"진짜 문제는<br><em>그다음이었다</em>"]];
    const tl=gsap.timeline({paused:true,defaults:{ease:"power2.out"}});window.__timelines=window.__timelines||{};window.__timelines["shorts-master"]=tl;
    scenes.forEach(([selector,start,end,title],index)=>{const scene=document.querySelector(selector),image=scene.querySelector(".image"),rain=scene.querySelector(".rain");tl.set(scene,{visibility:"visible",autoAlpha:1},start).set(".headline",{innerHTML:title},start);if(index)tl.fromTo(".headline",{autoAlpha:0,y:22},{autoAlpha:1,y:0,duration:.28},start);tl.fromTo(image,{scale:1.07,x:index%2?-26:22,y:index===4?36:-12,filter:`saturate(.62) contrast(1.2) brightness(${index===0?.76:.63})`},{scale:index===4?1.2:1.17,x:index%2?22:-22,y:index===4?-40:16,filter:`saturate(.9) contrast(1.08) brightness(${index===0?.9:.82})`,duration:end-start,ease:"none"},start);if(rain)tl.fromTo(rain,{y:-130,x:0},{y:230,x:-36,duration:1.55,repeat:Math.ceil((end-start)/1.55),ease:"none"},start);if(index<scenes.length-1)tl.to(scene,{autoAlpha:0,duration:.2},end-.18).set(scene,{visibility:"hidden"},end);tl.fromTo(".flash",{autoAlpha:0},{autoAlpha:.18,duration:.04,yoyo:true,repeat:1},start)});tl.set(".headline",{autoAlpha:1,y:0},0);
    tl.fromTo(".inside",{scale:.78,autoAlpha:0},{scale:1,autoAlpha:1,duration:.35},.05).fromTo(".outside",{scale:.78,autoAlpha:0},{scale:1,autoAlpha:1,duration:.35},1.92).fromTo(".clue-line",{scaleY:0,autoAlpha:0},{scaleY:1,autoAlpha:.8,duration:.5},2.0);
    document.querySelectorAll(".wave i").forEach((bar,i)=>tl.fromTo(bar,{scaleY:.12,autoAlpha:.25},{scaleY:1,autoAlpha:1,duration:.12,yoyo:true,repeat:90},5.1+(i%11)*.025));tl.fromTo(".quote",{x:-80,autoAlpha:0},{x:0,autoAlpha:1,duration:.34},5.45);tl.fromTo(".count-ring",{scale:.45,autoAlpha:0},{scale:1.05,autoAlpha:.92,duration:.85,yoyo:true,repeat:3},9.2).fromTo(".count",{scale:.5,autoAlpha:0},{scale:1,autoAlpha:1,duration:.45},10.9);tl.fromTo(".echo",{scale:.72,autoAlpha:0,filter:"blur(18px)"},{scale:1.14,autoAlpha:.75,filter:"blur(0px)",duration:2.7},13.55);tl.fromTo(".road-alert",{y:30,scale:.94,autoAlpha:0},{y:0,scale:1,autoAlpha:1,duration:.45},17.5).to(".road-alert",{scale:1.06,duration:3.4,ease:"none"},17.95);tl.fromTo(".progress i",{width:"0%"},{width:"100%",duration,ease:"none"},0);(window.HF_CAPTIONS?.cues||[]).forEach(cue=>{tl.set(".caption",{innerText:cue.text,autoAlpha:1},cue.start);tl.set(".caption",{autoAlpha:0},Math.min(duration,cue.end+.02))});
  </script>
</body>
