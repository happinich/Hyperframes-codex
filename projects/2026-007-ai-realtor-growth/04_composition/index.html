      :root{--ink:#10203d;--muted:#60738b;--blue:#367cf6;--mint:#20c6b4;--gold:#f1b92f;--red:#ff6474;--green:#2fb36e;--line:rgba(16,32,61,.13);--panel:rgba(255,255,255,.84)}

      .topbar{position:absolute;z-index:50;left:78px;right:78px;top:43px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:14px;font-size:23px;font-weight:900;letter-spacing:.13em}.brand-mark{display:flex;gap:5px}.brand-mark i{width:13px;height:13px;border-radius:50%;background:var(--gold)}.brand-mark i:nth-child(2){background:var(--blue)}.brand-mark i:nth-child(3){background:var(--mint)}.topic{font-size:20px;font-weight:850;letter-spacing:.1em;color:var(--muted)}
      .scene{position:absolute;z-index:10;inset:96px 70px 92px;visibility:hidden;opacity:0;display:grid;align-items:center}.panel{position:relative;min-height:800px;padding:62px 72px;border:1px solid var(--line);border-radius:46px;background:rgba(255,255,255,.7);box-shadow:0 28px 80px rgba(19,48,84,.12);overflow:hidden}.two{display:grid;grid-template-columns:.88fr 1.12fr;gap:64px;align-items:center}.kicker{margin-bottom:20px;color:var(--mint);font-size:23px;font-weight:900;letter-spacing:.19em;text-transform:uppercase}h1{margin:0;max-width:760px;font-size:72px;line-height:1.09;letter-spacing:-.055em;word-break:keep-all}h1.compact{font-size:61px;line-height:1.13}h1.long{font-size:54px;line-height:1.15}.sub{margin:26px 0 0;max-width:760px;color:var(--muted);font-size:27px;line-height:1.48;word-break:keep-all}.chips{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}.chip{padding:12px 19px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.9);font-size:20px;font-weight:900;box-shadow:0 10px 25px rgba(16,32,61,.07)}
      .visual{position:relative;height:560px}.card{border:1px solid var(--line);border-radius:28px;background:var(--panel);box-shadow:0 18px 48px rgba(16,32,61,.1)}.metric{font-size:66px;font-weight:900;letter-spacing:-.055em}.label{color:var(--muted);font-size:21px;font-weight:850}.mini{font-size:25px;font-weight:900}.node{display:grid;place-items:center;text-align:center;position:absolute;border:1px solid var(--line);background:#fff;border-radius:28px;box-shadow:0 18px 42px rgba(16,32,61,.1);font-size:23px;font-weight:900;line-height:1.25}.line{position:absolute;height:12px;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--mint),var(--blue));transform-origin:left}.pulse{position:absolute;border:10px solid rgba(54,124,246,.2);border-radius:50%}

      .extract{display:grid;place-items:center}.wave{position:absolute;left:15px;right:15px;top:270px;height:14px;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--mint),var(--gold))}.condition{width:150px;height:95px}.c1{left:30px;top:60px}.c2{right:30px;top:60px}.c3{left:30px;bottom:55px}.c4{right:30px;bottom:55px}.listing{width:180px;height:150px;background:var(--ink);color:#fff}.calendar{position:absolute;right:190px;bottom:185px;width:100px;height:100px;border-radius:24px;background:#e9f8f5;display:grid;place-items:center;color:var(--mint);font-size:38px;font-weight:900}

      .gate{display:grid;place-items:center}.gate-door{width:260px;height:360px;border-radius:30px;background:var(--ink);color:#fff;display:grid;place-items:center;text-align:center;font-size:38px;font-weight:900;line-height:1.2}.law{position:absolute;width:200px;height:105px}.l1{left:20px;top:85px}.l2{right:20px;top:85px}.l3{left:20px;bottom:85px}.l4{right:20px;bottom:85px;background:#e9f8f5;color:var(--green)}
      .signals{display:grid;grid-template-columns:1fr 1fr;gap:25px;align-items:center}.doc{height:480px;padding:36px}.doc-row{height:18px;margin:22px 0;border-radius:99px;background:#dfe9f3}.doc-row:nth-child(2n){width:72%}.lights{display:grid;gap:18px}.light{padding:24px 28px;display:flex;align-items:center;gap:20px;font-size:25px;font-weight:900}.light i{width:42px;height:42px;border-radius:50%;background:var(--green)}.light:nth-child(2) i{background:var(--gold)}.light:nth-child(3) i{background:var(--red)}
      .timebars{padding:50px 30px}.barrow{margin:45px 0}.barlabel{display:flex;justify-content:space-between;margin-bottom:12px;font-size:23px;font-weight:900}.bar{height:52px;border-radius:99px;background:#e2ebf3;overflow:hidden}.fill{height:100%;border-radius:99px;transform-origin:left}.fill.down{width:35%;background:var(--gold)}.fill.up{width:85%;background:linear-gradient(90deg,var(--mint),var(--blue))}.night{position:absolute;right:40px;bottom:25px;padding:20px 26px}
      .questions{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-content:center}.question{min-height:185px;padding:28px;display:grid;align-content:center;font-size:28px;font-weight:900;line-height:1.25}.verify{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:180px;height:180px;border-radius:50%;display:grid;place-items:center;text-align:center;background:var(--ink);color:#fff;font-size:30px;font-weight:900;z-index:3}
      .goals{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:center}.goal{min-height:290px;padding:30px;display:grid;align-content:center;text-align:center}.goal strong{font-size:60px}.goal span{margin-top:14px;color:var(--muted);font-size:22px;font-weight:850}.log{position:absolute;left:55px;right:55px;bottom:20px;height:85px;padding:22px 30px;display:flex;align-items:center;justify-content:space-between}.version{color:var(--mint);font-size:28px;font-weight:900}
      .ending{display:grid;place-items:center}.growth{position:absolute;left:60px;right:60px;top:280px;height:15px;border-radius:99px;background:#dfe9f3;overflow:hidden}.growth i{display:block;width:5%;height:100%;background:linear-gradient(90deg,var(--gold),var(--mint),var(--blue));transform-origin:left}.ep{width:430px;min-height:260px;padding:42px;text-align:center;background:linear-gradient(145deg,var(--ink),#24548c);color:#fff}.ep small{display:block;color:#bfe7ff;font-size:20px;font-weight:900;letter-spacing:.12em}.ep strong{display:block;margin-top:18px;font-size:42px;line-height:1.2}.five{position:absolute;right:38px;top:38px;font-size:65px;font-weight:900;color:var(--mint)}
      .progress{position:absolute;z-index:50;left:70px;right:70px;bottom:42px;height:7px;border-radius:99px;background:rgba(16,32,61,.08);overflow:hidden}.progress-fill{width:100%;height:100%;transform-origin:left;background:linear-gradient(90deg,var(--gold),var(--mint),var(--blue))}
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      const DURATION=316.988;
      const scenes=[
        {id:"S01",start:0,end:22.15,kicker:"Missed Call",title:"전화 한 통을 놓치면\n계약 한 건이 사라집니다",sub:"혼자 일하는 순간에도 전화는 계속 옵니다. AI가 대신 받고 매물을 찾고 예약까지 잡을 수 있을까요?",chips:["24시간","놓친 전화","AI 비서"],visual:"phone"},
        {id:"S02",start:22.15,end:40.85,kicker:"Start",title:"오늘부터 직접\n만들어보겠습니다",sub:"완성품 자랑이 아닙니다. 반복 업무를 하나씩 바꾸고 실패와 성장 과정을 전부 공개합니다.",chips:["공개 실험","실패 기록","성장 과정"],visual:"roadmap"},
        {id:"S03",start:40.85,end:70.29,kicker:"One Person Office",title:"한 사람이 모든 일을\n동시에 감당합니다",sub:"매물, 광고, 조건 상담, 권리 검토, 현장 안내. 반복 질문이 중요한 상담 시간을 지웁니다.",chips:["매물","상담","현장 안내"],visual:"schedule"},
        {id:"S04",start:70.29,end:88.46,kicker:"First MVP",title:"첫 목표는 단순합니다\nAI가 전화를 받는 것",sub:"지역과 예산, 평형, 입주일을 파악하고 매물을 찾아 방문 예약 후보까지 남깁니다.",chips:["음성 상담","조건 추출","방문 예약"],visual:"extract"},
        {id:"S05",start:88.46,end:111,kicker:"Accuracy First",title:"말솜씨보다\n정확도가 먼저입니다",sub:"가격과 주소를 한 번만 틀려도 신뢰는 무너집니다. 확인된 매물 데이터 안에서만 답하게 만듭니다.",chips:["오답 차단","검증 DB","사람 확인"],visual:"shield"},
        {id:"S06",start:111,end:134.22,kicker:"Experiment Flow",title:"복잡해 보여도\n볼 숫자는 세 개입니다",sub:"전화에서 질문, 검색, 답변, 예약까지 연결하고 응대율·오답률·방문 전환율을 측정합니다.",chips:["응대율","오답률","방문율"],visual:"pipeline"},
        {id:"S07",start:134.22,end:164.64,kicker:"Legal Gate",title:"편리함보다\n법과 신뢰가 먼저입니다",sub:"현장 안내는 공인중개사법과 신고 절차를 확인하고, 자동화할 수 없다면 반드시 사람이 승인합니다.",chips:["법률 검토","신고 절차","사람 승인"],visual:"gate"},
        {id:"S08",start:164.64,end:191.24,kicker:"Risk Assistant",title:"계약을 재촉하지 않고\n위험을 먼저 보여줍니다",sub:"등기와 권리관계의 확인 항목을 정리하고, 놓치기 쉬운 신호를 상담 단계에서 꺼내 보여줍니다.",chips:["등기 확인","위험 신호","최종 판단은 사람"],visual:"signals"},
        {id:"S09",start:191.24,end:212.56,kicker:"Time Gain",title:"매출보다 먼저\n시간이 달라질 겁니다",sub:"반복 업무는 줄이고 매물 검증과 전문 상담 시간은 늘립니다. 작은 사무소의 대응력이 달라집니다.",chips:["반복 감소","전문 상담","야간 응대"],visual:"time"},
        {id:"S10",start:212.56,end:236.08,kicker:"Open Questions",title:"하지만 정말\n그렇게 될까요?",sub:"통화 품질, 매물 정확도, 방문 전환, 운영비. 사업계획서가 아니라 고객 반응과 숫자로 답해야 합니다.",chips:["통화","정확도","방문","비용"],visual:"questions"},
        {id:"S11",start:236.08,end:278.7,kicker:"Public Growth",title:"성공만이 아니라\n실패까지 공개하겠습니다",sub:"어색한 통화와 실패한 답변까지 기록합니다. 숫자가 안 나오면 바꾸고, 불편하면 다시 만듭니다.",chips:["95% 응대","주 15시간","누락 0 지향"],visual:"goals"},
        {id:"S12",start:278.7,end:316.988,kicker:"Next Episode",title:"AI와 함께 더 강해질까\n다시 전화기로 돌아갈까",sub:"작은 사무소 하나에서 답을 찾겠습니다. 다음 편은 AI가 읽을 수 있는 매물 데이터 만들기입니다.",chips:["진행률 5%","실전 검증","EP.2"],visual:"ending"}
      ];
      function visual(t){
        if(t==="phone")return `<div class="visual phone"><div class="ring"></div><div class="phone-core">AI가<br>대신<br>받는다면?</div><div class="card missed"><div class="label">놓친 전화</div><div class="metric" data-count="12">12</div></div><div class="card lost"><div class="mini">고객 이탈 →</div></div></div>`;
        if(t==="roadmap")return `<div class="visual roadmap"><div class="card"><div class="label">STEP 1</div><div class="mini">전화</div></div><div class="card"><div class="label">STEP 2</div><div class="mini">매물 검색</div></div><div class="card"><div class="label">STEP 3</div><div class="mini">예약</div></div><div class="card"><div class="label">STEP 4</div><div class="mini">검증</div></div><div class="percent">0%</div></div>`;
        if(t==="schedule")return `<div class="visual schedule">${["매물 확인","광고 제작","조건 상담","권리 검토","현장 안내","반복 전화"].map((x,i)=>`<div class="card task"><i>${i+1}</i><b>${x}</b></div>`).join("")}<div class="overflow">시간 부족</div></div>`;
        if(t==="extract")return `<div class="visual extract"><div class="wave"></div><div class="node condition c1">지역</div><div class="node condition c2">예산</div><div class="node condition c3">평형</div><div class="node condition c4">입주일</div><div class="node listing">매물<br>검색</div><div class="calendar">✓</div></div>`;
        if(t==="shield")return `<div class="visual shield"><div class="shield-core">확인된<br>매물 DB</div><div class="card wrong w1">잘못된 가격 ✕</div><div class="card wrong w2">틀린 주소 ✕</div><div class="card human">담당자 확인 ✓</div></div>`;
        if(t==="pipeline")return `<div class="visual"><div class="pipeline">${["전화","질문","검색","답변","예약"].map((x,i)=>`<div class="node">${x}</div>${i<4?'<div class="arrow">→</div>':''}`).join("")}</div><div class="kpis"><div class="card kpi"><strong>응대율</strong><span>얼마나 받았나</span></div><div class="card kpi"><strong>오답률</strong><span>무엇을 틀렸나</span></div><div class="card kpi"><strong>방문율</strong><span>몇 건 연결됐나</span></div></div></div>`;
        if(t==="gate")return `<div class="visual gate"><div class="gate-door">사람<br>승인<br>GATE</div><div class="node law l1">공인중개사법</div><div class="node law l2">신고 절차</div><div class="node law l3">가능 범위</div><div class="node law l4">확인 완료 ✓</div></div>`;
        if(t==="signals")return `<div class="visual signals"><div class="card doc"><div class="label">권리관계 자료</div>${[1,2,3,4,5,6].map(()=>'<div class="doc-row"></div>').join("")}</div><div class="lights"><div class="card light"><i></i>확인</div><div class="card light"><i></i>주의</div><div class="card light"><i></i>추가 확인</div></div></div>`;
        if(t==="time")return `<div class="visual card timebars"><div class="barrow"><div class="barlabel"><span>반복 업무</span><span>감소</span></div><div class="bar"><div class="fill down"></div></div></div><div class="barrow"><div class="barlabel"><span>전문 상담</span><span>증가</span></div><div class="bar"><div class="fill up"></div></div></div><div class="card night">밤에도 기본 안내 ✓</div></div>`;
        if(t==="questions")return `<div class="visual questions">${["자연스럽게 통화할까?","매물을 틀리지 않을까?","실제 방문까지 올까?","비용보다 시간이 절약될까?"].map(x=>`<div class="card question">${x}</div>`).join("")}<div class="verify">직접<br>검증</div></div>`;
