<!doctype html>
<html lang="ko" data-composition-variables='[{"id":"offset","type":"number","label":"Segment offset seconds","default":0}]'>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>새벽 3시 17분, 아파트 한 층이 사라졌다</title>
    <style>
      :root{--black:#05070d;--navy:#0b1730;--ice:#f5f7ff;--muted:#9aa7ba;--green:#6fe7bd;--red:#ff4d5f;--amber:#e8a33d}
      *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
      body{font-family:Arial,sans-serif;color:var(--ice)}
      #master{position:relative;width:1920px;height:1080px;overflow:hidden;isolation:isolate;background:#000}
      .clip{visibility:hidden;opacity:0}.scene{position:absolute;inset:0;overflow:hidden;background:var(--black)}
      .scene-image{position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;opacity:0;will-change:transform,opacity}
      .vignette{position:absolute;inset:0;background:radial-gradient(circle at 50% 47%,transparent 18%,rgba(2,4,10,.18) 52%,rgba(2,4,10,.74) 100%),linear-gradient(180deg,rgba(0,0,0,.34),transparent 24%,transparent 70%,rgba(0,0,0,.72))}
      .cast{position:absolute;inset:0;opacity:.14;background:linear-gradient(110deg,transparent 12%,rgba(87,218,175,.25) 46%,transparent 72%)}
      .mist{position:absolute;left:-18%;right:-18%;bottom:-230px;height:500px;opacity:.18;background:radial-gradient(ellipse,rgba(130,180,190,.28),transparent 68%)}
      .grain{position:absolute;inset:0;opacity:.09;background-image:repeating-radial-gradient(circle at 17% 23%,rgba(255,255,255,.24) 0 1px,transparent 1px 4px),repeating-radial-gradient(circle at 73% 67%,rgba(255,255,255,.11) 0 1px,transparent 1px 5px);background-size:11px 13px,17px 19px}
      .scan{position:absolute;left:0;right:0;top:-110px;height:94px;opacity:0;background:linear-gradient(180deg,transparent,rgba(195,242,228,.13),transparent)}
      .beat{position:absolute;left:0;top:0;width:100%;height:4px;opacity:0;transform-origin:left;background:linear-gradient(90deg,transparent,var(--green),transparent);box-shadow:0 0 20px rgba(111,231,189,.45)}
      .film{position:absolute;left:0;right:0;z-index:30;height:40px;background:#000}.film.top{top:0}.film.bottom{bottom:0}
      .progress{position:absolute;left:0;bottom:40px;z-index:31;width:100%;height:2px;transform-origin:left;background:linear-gradient(90deg,var(--red),rgba(255,77,95,.1));opacity:.44}
      .overlay{position:absolute;inset:0;z-index:8;pointer-events:none}.panel{position:absolute;left:120px;right:120px;top:100px;bottom:142px;padding:42px 48px;background:linear-gradient(180deg,rgba(5,7,13,.48),rgba(5,7,13,.76));border:1px solid rgba(245,247,255,.1);box-shadow:0 30px 90px rgba(0,0,0,.42)}
      .panel.compact{left:250px;right:250px;top:160px;bottom:190px}.kicker{font-size:22px;letter-spacing:.18em;color:var(--green)}
      .headline{max-width:1340px;margin-top:16px;font-size:72px;line-height:1.08;letter-spacing:-.035em;font-weight:800;word-break:keep-all}
      .headline.small{font-size:56px}.sub{margin-top:18px;max-width:1280px;font-size:29px;line-height:1.45;color:var(--muted)}
      .red{color:var(--red)}.green{color:var(--green)}.amber{color:var(--amber)}.reveal{opacity:0;transform:translateY(18px)}
      .floor14{position:absolute;right:180px;top:185px;font-size:300px;line-height:.8;font-weight:900;color:var(--red);text-shadow:0 0 60px rgba(255,77,95,.4)}
      .broadcast{position:absolute;left:140px;right:140px;bottom:150px;padding:28px 34px;border-left:5px solid var(--red);background:rgba(5,7,13,.84);font-size:38px;line-height:1.45}
      .rule-list{margin:42px 0 0;padding:0;list-style:none;display:grid;gap:20px;max-width:1180px}.rule-list li{padding:20px 24px;font-size:32px;background:rgba(5,7,13,.68);border-left:4px solid rgba(111,231,189,.55)}
      .timecode{position:absolute;inset:0;display:grid;place-items:center;font-size:220px;font-weight:900;letter-spacing:-.06em;color:var(--green);text-shadow:0 0 60px rgba(111,231,189,.38)}
      .systemline{position:absolute;left:260px;right:260px;bottom:190px;padding:24px;text-align:center;font:700 34px/1.2 monospace;letter-spacing:.05em;color:var(--green);background:rgba(0,0,0,.84);border:1px solid rgba(111,231,189,.36)}
      .floor-stack{position:absolute;right:170px;top:145px;width:440px;display:grid;gap:8px}.floor-row{height:60px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;background:rgba(245,247,255,.08);border:1px solid rgba(245,247,255,.1);font-size:24px}.floor-row.hot{color:var(--green);border-color:rgba(111,231,189,.55);box-shadow:0 0 26px rgba(111,231,189,.14)}
      .elevator{position:absolute;right:165px;top:125px;width:430px;height:720px;display:grid;place-items:center;background:rgba(0,0,0,.78);border:1px solid rgba(245,247,255,.16)}.digits{display:grid;gap:18px;text-align:center;font-size:108px;font-weight:900}.digits .missing{padding:4px 30px;color:var(--red);border:2px solid var(--red)}
      .wave{position:absolute;left:170px;right:170px;top:520px;height:170px;display:flex;align-items:center;justify-content:center;gap:10px}.wave i{width:8px;background:var(--ice);opacity:.18;transform-origin:center}
      .voices{position:absolute;top:350px;width:520px;padding:28px;font-size:34px;background:rgba(5,7,13,.8);border:1px solid rgba(245,247,255,.12)}.voices.left{left:120px;border-left:5px solid var(--green)}.voices.right{right:120px;border-right:5px solid var(--red);text-align:right}
      .clock-grid{position:absolute;left:170px;right:170px;top:310px;display:grid;grid-template-columns:repeat(4,1fr);gap:24px}.clock{aspect-ratio:1;border-radius:50%;border:3px solid rgba(245,247,255,.65);display:grid;place-items:center;font-size:42px;background:rgba(5,7,13,.68)}
      .door-grid{position:absolute;left:160px;right:160px;top:360px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.door{height:280px;display:grid;place-items:center;font-size:44px;font-weight:800;background:linear-gradient(180deg,#162334,#080b11);border:1px solid rgba(245,247,255,.16)}.door.done{border-color:var(--red);color:var(--red)}
      .record-grid{position:absolute;left:150px;right:150px;top:320px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.record{min-height:300px;padding:30px;background:rgba(232,225,204,.91);color:#191916;transform:rotate(-1deg);box-shadow:0 24px 60px rgba(0,0,0,.45)}.record:nth-child(2){transform:rotate(1.3deg)}.record h3{margin:0 0 30px;font-size:42px}.record p{font-size:25px}.stamp{display:inline-block;margin-top:20px;padding:10px 18px;color:var(--red);border:4px solid var(--red);font-size:28px;font-weight:800;transform:rotate(-5deg)}
      .countdown{position:absolute;inset:0;display:grid;place-items:center;font:900 230px/1 monospace;color:var(--red);text-shadow:0 0 70px rgba(255,77,95,.38)}
      .status-list{position:absolute;left:280px;right:280px;top:280px;display:grid;gap:16px}.status{display:flex;justify-content:space-between;padding:19px 24px;font:700 28px/1.2 monospace;background:rgba(0,0,0,.8);border:1px solid rgba(245,247,255,.12)}.status strong{color:var(--green)}
      .doc-swap{position:absolute;left:180px;right:180px;top:300px;display:grid;grid-template-columns:1fr 130px 1fr;align-items:center;gap:28px}.doc{padding:34px;min-height:310px;color:#1b1c1d;background:rgba(245,247,255,.91);font-size:28px}.doc .number{font-size:58px;font-weight:900;margin-top:45px}.arrow{text-align:center;font-size:82px;color:var(--red)}
      .flash{position:absolute;inset:0;background:rgba(245,247,255,.2);opacity:0}.outro-black{position:absolute;inset:0;background:#000;opacity:0}
    </style>
  </head>
  <body>
    <div id="master" data-composition-id="youtube-master" data-start="0" data-duration="1105.606" data-width="1920" data-height="1080">
      <audio id="voice" data-start="0" data-duration="1105.606" data-track-index="0" src="assets/audio/voice.wav" data-volume="1"></audio>
      <div id="scene-host"></div><div class="film top"></div><div class="film bottom"></div><div class="progress"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="scene-data.js"></script>
    <script>
      const DURATION=1105.606,A="assets/visuals/";
      function segmentOffset(){
        try{
          const vars=window.__hyperframes&&window.__hyperframes.getVariables&&window.__hyperframes.getVariables();
          const value=Number(vars&&vars.offset);
          return Number.isFinite(value)?value:0;
        }catch(error){return 0}
      }
      const OFFSET=segmentOffset();
      const COPY={
        building:["분명히 기억하는 집","104동 1402호","층수를 착각했을 가능성은 없습니다."],
        phone:["“우리 집이 몇 호인지","아직도 기억하니?”","전화기 너머에서 엘리베이터 도착음이 들렸습니다."],
        approach:["연락이 끊긴 지","사흘째","오래된 단지 · 반쯤 꺼진 가로등 · 열린 공동현관"],
        elevator:["버튼도, 복도도,","네 개의 현관문도 그대로였다","토요일 저녁인데 사람 기척만 없었습니다."],
        absence:["밥과 국은 식어 있었고","사람만 없었다","휴대전화 · 지갑 · 외투 · 운동화는 그대로였습니다."],
        skip:["13 → 15","제가 서 있는 14층만","엘리베이터는 계속 건너뛰었습니다."],
        keynote:["“호수를 말하면","그 집부터 사라진다.”","2006년 · 벽장 안쪽 · 어머니 글씨"],
        calls:["부재중 전화","7통","모두 새벽 3시 17분 · 발신 1402호"],
        separation:["14층이 건물에서","수평으로 밀려났다","경고음 뒤, 모든 전등이 한꺼번에 꺼졌습니다."],
        camera:["현관 카메라는","문을 통과했습니다","HALL → LIVING ROOM → SMALL ROOM"],
        corridor:["같은 네 개의 문이","계속 반복됐다","복도는 건물 길이보다 훨씬 길어졌습니다."],
        memory:["제가 기억한 어머니는","누구였을까요?","사진 속 자리도, 통화 기록도, 기억도 바뀌기 시작했습니다."],
        chase:["불이 뒤에서부터","하나씩 꺼졌다","벽 속에서 엘리베이터 도착음이 따라왔습니다."],
        escape:["3시 31분","13층 계단 표지","방화문이 닫히자 모든 목소리가 끊겼습니다."],
        reality:["13층 다음은","15층","안내도 · 우편함 · 외벽 창문 · 주민 기억"],
        voicemail:["발신 번호","1402","전화번호가 아니라 호수 네 자리만 찍혀 있었습니다."],
        newhome:["5층 빌라","엘리베이터 없음","몇 달 동안 아무 일도 없었습니다."],
        missing:["1402호 · 2006년","미복귀","어머니 이름과 날짜만 남았습니다."]
      };
      function wave(){return Array.from({length:46},function(_,i){return '<i style="height:'+(24+(i*37)%105)+'px"></i>'}).join("")}
      function panel(scene,copy){return '<div class="overlay"><div class="panel compact"><div class="kicker reveal">'+scene.label+'</div><div class="headline reveal">'+copy[0]+'<br><span class="red">'+copy[1]+'</span></div><div class="sub reveal">'+copy[2]+'</div></div></div>'}
      function overlay(scene){
        if(scene.overlay==="warning")return '<div class="overlay"><div class="floor14 reveal">14</div><div class="broadcast reveal">현재 14층은 존재하지 않습니다.<br>현관문과 계단 문을 열지 마십시오.</div></div>';
        if(scene.overlay==="rules")return '<div class="overlay"><div class="panel"><div class="kicker reveal">'+scene.label+'</div><ul class="rule-list"><li class="reveal">03:17 전에 내려갈 것</li><li class="reveal">방송이 나오면 말하지 말 것</li><li class="reveal">내가 불러도 문을 열지 말 것</li><li class="reveal red">호수를 말하지 말 것</li></ul></div></div>';
        if(scene.overlay==="wallpad"||scene.overlay==="time")return '<div class="overlay"><div class="timecode reveal">03:17</div>'+(scene.overlay==="wallpad"?'<div class="systemline reveal">세대 확인 대기 중</div>':'')+'</div>';
        if(scene.overlay==="building")return panel(scene,COPY.building).replace('</div></div>','<div class="floor-stack reveal">'+[15,14,13,12,11,10].map(function(n){return '<div class="floor-row '+(n===14?'hot':'')+'"><span>'+n+'층</span><span>'+(n===14?'1402':'등록')+'</span></div>'}).join("")+'</div></div></div>');
        if(scene.overlay==="elevator")return panel(scene,COPY.elevator).replace('</div></div>','<div class="elevator reveal"><div class="digits"><span>13</span><span class="missing">14</span><span>15</span></div></div></div></div>');
        if(scene.overlay==="phone"||scene.overlay==="voicemail")return panel(scene,COPY[scene.overlay]).replace('</div></div>','<div class="wave">'+wave()+'</div></div></div>');
        if(scene.overlay==="voices"||scene.overlay==="double"||scene.overlay==="stereo")return '<div class="overlay"><div class="voices left reveal">복도 왼쪽<br><span class="green">'+(scene.overlay==="double"?'“절대 열지 마.”':'어머니 목소리')+'</span></div><div class="voices right reveal">복도 오른쪽<br><span class="red">'+(scene.overlay==="double"?'“엄마야. 열어.”':'같은 목소리')+'</span></div></div>';
        if(scene.overlay==="clocks")return '<div class="overlay"><div class="panel"><div class="kicker reveal">'+scene.label+'</div><div class="clock-grid">'+["03:14","03:15","03:16","03:17"].map(function(v){return '<div class="clock reveal">'+v+'</div>'}).join("")+'</div></div></div>';
        if(scene.overlay==="doors")return '<div class="overlay"><div class="panel"><div class="kicker reveal">'+scene.label+'</div><div class="door-grid">'+[1401,1402,1403,1404].map(function(n,i){return '<div class="door reveal '+(i===1?'':'done')+'">'+n+'호</div>'}).join("")+'</div></div></div>';
        if(scene.overlay==="eras"||scene.overlay==="records")return '<div class="overlay"><div class="panel"><div class="kicker reveal">'+scene.label+'</div><div class="record-grid">'+["1996","2006","2016"].map(function(y,i){return '<div class="record reveal"><h3>'+y+'</h3><p>'+(scene.overlay==="eras"?["브라운관 TV","폴더폰 벨소리","검은 월패드"][i]:"층 분리 기록")+'</p><p>'+(i===1?"미복귀 1":"세대 확인")+'</p><span class="stamp">확인</span></div>'}).join("")+'</div></div></div>';
        if(scene.overlay==="reassign")return '<div class="overlay"><div class="countdown reveal">02:00</div><div class="systemline reveal">미등록 거주자 세대 재배정 시작</div></div>';
        if(scene.overlay==="documents")return '<div class="overlay"><div class="doc-swap"><div class="doc reveal">기억 속 주소<div class="number">104동 1402호</div></div><div class="arrow reveal">→</div><div class="doc reveal">변경된 기록<div class="number red">104동 1502호</div></div></div></div>';
        if(scene.overlay==="final")return '<div class="overlay"><div class="status-list"><div class="status reveal"><span>14층 미등록 세대</span><strong>확인</strong></div><div class="status reveal"><span>기억 보유자 위치</span><strong>확인</strong></div><div class="status reveal"><span>1402호 재배정</span><strong class="red">완료</strong></div></div></div>';
        if(scene.overlay==="outro")return '<div class="overlay"><div class="outro-black"></div></div>';
        if(COPY[scene.overlay])return panel(scene,COPY[scene.overlay]);
        return panel(scene,[scene.label,"기억이 현실을 바꿨다","14층은 건물에 붙어 있는 장소가 아니었습니다."]);
      }
      function sceneMarkup(scene){
        if(scene.end<=OFFSET||scene.start>=OFFSET+240)return "";
        var imgs=scene.visuals.map(function(name,i){return '<img class="scene-image" data-i="'+i+'" src="'+A+name+'.png" alt="">'}).join("");
        var localStart=Math.max(0,scene.start-OFFSET),localEnd=Math.max(localStart,scene.end-OFFSET);
        return '<section id="scene-'+scene.id+'" class="scene clip" data-start="'+localStart+'" data-duration="'+(localEnd-localStart)+'">'+imgs+overlay(scene)+'<div class="vignette"></div><div class="cast"></div><div class="mist"></div><div class="grain"></div><div class="scan"></div><div class="beat"></div><div class="flash"></div></section>';
      }
      document.getElementById("scene-host").innerHTML=window.HF_SCENES.map(sceneMarkup).join("");
      window.__timelines=window.__timelines||{};
      var tl=gsap.timeline({paused:true,defaults:{ease:"power2.out"}});
      tl.set(".progress",{scaleX:0},0).to(".progress",{scaleX:1,duration:DURATION,ease:"none"},0);
      window.HF_SCENES.forEach(function(scene,sceneIndex){
        var el=document.getElementById("scene-"+scene.id);
        if(!el)return;
        var images=Array.from(el.querySelectorAll(".scene-image"));
        var s=Math.max(0,scene.start-OFFSET),e=Math.max(s,scene.end-OFFSET),d=e-s,slot=d/Math.max(1,images.length);
        tl.set(el,{autoAlpha:1},s);
        images.forEach(function(img,i){
          var vs=s+i*slot,dir=(sceneIndex+i)%2?1:-1;
          tl.set(img,{autoAlpha:i===0?1:0},s);
          if(i>0)tl.to(img,{autoAlpha:1,duration:.7,ease:"power1.inOut"},vs);
          tl.fromTo(img,{scale:1.06+i*.025,xPercent:-1.5*dir,yPercent:(i%3)-1},{scale:1.15+i*.025,xPercent:1.8*dir,yPercent:1-(i%3),duration:slot+.15,ease:"none"},vs);
          if(i<images.length-1)tl.to(img,{autoAlpha:0,duration:.7},vs+slot-.7);
        });
        el.querySelectorAll(".reveal").forEach(function(node,i){tl.fromTo(node,{autoAlpha:0,y:18},{autoAlpha:1,y:0,duration:.58},s+.12+Math.min(i*1.3,Math.max(.2,d-1.1)))});
        var scan=el.querySelector(".scan"),beat=el.querySelector(".beat"),cast=el.querySelector(".cast");
        for(var t=2.7;t<d-.7;t+=3.1){
          tl.fromTo(beat,{autoAlpha:0,scaleX:.05,y:80+(t*47)%820},{autoAlpha:.42,scaleX:1,duration:.34,yoyo:true,repeat:1},s+t);
          if(Math.floor(t/3.1)%3===2)tl.fromTo(scan,{autoAlpha:0,y:0},{autoAlpha:.55,y:1180,duration:2,ease:"none"},s+t);
        }
        tl.to(cast,{xPercent:sceneIndex%2?18:-18,duration:d,ease:"sine.inOut"},s);
        if(scene.overlay==="warning"){var n=el.querySelector(".floor14");for(var q=1;q<d-1;q+=2.4)tl.fromTo(n,{autoAlpha:1},{autoAlpha:.15,duration:.16,yoyo:true,repeat:3},s+q)}
        if(scene.overlay==="building")tl.to(el.querySelector(".floor-row.hot"),{x:70,duration:4,ease:"sine.inOut"},s+5);
        if(scene.overlay==="phone"||scene.overlay==="voicemail")el.querySelectorAll(".wave i").forEach(function(b,i){tl.fromTo(b,{scaleY:.18,autoAlpha:.18},{scaleY:1,autoAlpha:.72,duration:.24,yoyo:true,repeat:5},s+2+(i%11)*.11)});
        if(scene.overlay==="separation"||scene.overlay==="chase"){var f=el.querySelector(".flash");for(var z=2;z<d-1;z+=2.2)tl.fromTo(f,{autoAlpha:0},{autoAlpha:.2,duration:.08,yoyo:true,repeat:1},s+z)}
        if(scene.overlay==="reassign")tl.to(el.querySelector(".countdown"),{scale:1.05,textShadow:"0 0 95px rgba(255,77,95,.9)",duration:1.2,yoyo:true,repeat:Math.max(1,Math.floor((d-2)/2.4)-1)},s+1);
        if(scene.overlay==="final")el.querySelectorAll(".status").forEach(function(row,i){tl.fromTo(row,{autoAlpha:0,x:-24},{autoAlpha:1,x:0,duration:.45},s+5+i*3.2)});
        if(scene.overlay==="outro")tl.to(el.querySelector(".outro-black"),{autoAlpha:1,duration:d,ease:"power1.in"},s);
        tl.set(el,{autoAlpha:0},e);
      });
      window.__timelines["youtube-master"]=tl;
    </script>
  </body>
</html>
