<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>새벽 3시 17분, 아파트 한 층이 사라졌다 - Shorts</title>
    <style>
      :root { --bg: #090d19; --ink: #f7f7fa; --accent: #63e3c3; --muted: #a4aec8; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); font-family: sans-serif; }
      .clip { visibility: hidden; }
      #shorts {
        position: relative; width: 1080px; height: 1920px; overflow: hidden; color: var(--ink);
        background: radial-gradient(circle at 52% 22%, rgba(99,227,195,.18), transparent 28%), #090d19;
      }
      .safe-title { position: absolute; left: 72px; top: 164px; font-size: 25px; color: var(--accent); }
      .placeholder {
        position: absolute; inset: 380px 72px 430px; display: grid; place-items: center;
        border: 1px solid rgba(255,255,255,.12); padding: 40px; text-align: center;
        color: var(--muted); font-size: 31px;
      }
    </style>
  </head>
  <body>
    <div id="shorts" data-composition-id="shorts-master" data-width="1080" data-height="1920">
      <audio id="voice" data-start="0" data-duration="1101.420" data-track-index="0"
        src="../assets/audio/voice.wav" data-volume="1"></audio>
      <div class="safe-title">새벽 3시 17분, 아파트 한 층이 사라졌다</div>
      <div class="placeholder">Shorts용 씬 재배치를 여기에 제작합니다</div>
      <!-- Captions are delivered as external SRT/VTT files, not burned into the MP4. -->
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["shorts-master"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
