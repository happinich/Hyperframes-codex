<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <link rel="icon" href="data:,">
    <title>seg-test</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
      #seg { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      .host { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="seg" data-composition-id="seg-test" data-start="0" data-duration="20" data-width="1920" data-height="1080">
      <audio data-start="0" data-duration="20" data-media-start="200" data-track-index="0"
        src="assets/audio/voice.wav" data-volume="1"></audio>
      <div class="host" data-composition-id="seg-test-src" data-composition-src="index-silent.html"
        data-start="0" data-duration="20" data-track-index="1"
        data-variable-values='{"offset":200}'></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 20 });
      window.__timelines["seg-test"] = tl;
    </script>
  </body>
</html>
