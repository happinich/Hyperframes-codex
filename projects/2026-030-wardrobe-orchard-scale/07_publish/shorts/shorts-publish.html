<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>030 · 쇼츠 3편</title><style>body{margin:0;background:#11161b;color:#eee;font:17px/1.6 sans-serif}main{max-width:1020px;margin:auto;padding:32px 24px}h1{font-size:30px;line-height:1.4}h2{font-size:21px}section{background:#202831;padding:20px;border-radius:12px;margin:24px 0}textarea{width:100%;box-sizing:border-box;padding:14px;background:#101820;color:#eee;font:16px/1.6 sans-serif;border:1px solid #798693;resize:vertical}button{padding:12px 25px;margin-top:12px;background:#d9bb80;border:0;border-radius:6px;font-weight:bold}img{width:min(100%,460px);margin:10px}video{width:min(100%,340px)}a{color:#add5ff}</style></head><body><main><h1>030 · 쇼츠 3편</h1><p>창작 공포 · YouTube 자동 자막 · 외부 SRT/VTT 없음</p><section><h2>1. 장롱 안 의자는 뒤를 보고 있었어요</h2><a href="shorts-01-publish.html">게시 도우미 열기</a></section><section><h2>2. 바람이 없는데 나무의 자리가 바뀌었어요</h2><a href="shorts-02-publish.html">게시 도우미 열기</a></section><section><h2>3. 영점을 누르자 빈 의자가 눌렸어요</h2><a href="shorts-03-publish.html">게시 도우미 열기</a></section><p id="status" role="status"></p></main><script>document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const t=document.getElementById(b.dataset.copy);try{await navigator.clipboard.writeText(t.value)}catch{t.focus();t.select();document.execCommand('copy')}document.getElementById('status').textContent='복사했습니다.'});</script></body></html>
