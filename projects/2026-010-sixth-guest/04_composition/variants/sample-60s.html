<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>여섯 번째 손님 - 1분 검수 샘플</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
      #sample { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      .sample-host { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="sample" data-composition-id="review-sample-60s" data-start="0" data-duration="60" data-width="1920" data-height="1080">
      <div id="sample-source" class="sample-host" data-composition-id="sample-source" data-composition-src="index.html" data-start="0" data-duration="60" data-track-index="0"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 60 });
      window.__timelines["review-sample-60s"] = tl;
    </script>
  </body>
</html>
