    <style>
      :root {
        --black: #05070d;
        --navy: #0b1730;
        --ice: #f5f7ff;
        --muted: #9aa7ba;
        --red: #c62f46;
        --amber: #d4a25f;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
      body {
        font-family: Arial, sans-serif;
        color: var(--ice);
      }
      #master {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        isolation: isolate;
        background: #000;
      }
      .clip { visibility: hidden; opacity: 0; }
      .scene {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: var(--black);
      }
      .scene-image {
        position: absolute;
        inset: -4%;
        width: 108%;
        height: 108%;
        opacity: 0;
        object-fit: cover;
        filter: saturate(.8) contrast(1.1) brightness(.86);
        will-change: transform, filter;
      }
      .scene-scrim {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 50% 44%, transparent 20%, rgba(2, 4, 10, .16) 58%, rgba(2, 4, 10, .52) 100%),
          linear-gradient(180deg, rgba(0, 0, 0, .18), transparent 28%, transparent 70%, rgba(0, 0, 0, .58));
      }
      .scene-glow {
        position: absolute;
        width: 720px;
        height: 720px;
        right: -180px;
        top: -220px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(44, 100, 158, .22), transparent 68%);
        mix-blend-mode: screen;
        filter: blur(8px);
      }
      .grain {
        position: absolute;
        inset: 0;
        opacity: .16;
        background-image:
          repeating-radial-gradient(circle at 17% 23%, rgba(255,255,255,.25) 0 1px, transparent 1px 4px),
          repeating-radial-gradient(circle at 73% 67%, rgba(255,255,255,.12) 0 1px, transparent 1px 5px);
        background-size: 11px 13px, 17px 19px;
        mix-blend-mode: overlay;
      }
      .mist {
        position: absolute;
        left: -20%;
        bottom: -190px;
        width: 140%;
        height: 420px;
        opacity: .22;
        background: radial-gradient(ellipse, rgba(146, 178, 205, .32), transparent 68%);
        filter: blur(38px);
      }
      .scanline {
        position: absolute;
        left: 0;
        right: 0;
        top: -90px;
        height: 78px;
        opacity: 0;
        background: linear-gradient(180deg, transparent, rgba(199, 225, 245, .12), transparent);
        mix-blend-mode: screen;
      }
      .scene[data-type="cctv"] .scanline,
      .scene[data-type="blackout"] .scanline,
      .scene[data-type="double"] .scanline,
      .scene[data-type="reversal"] .scanline { opacity: .9; }
      .corner {
        position: absolute;
        width: 44px;
        height: 44px;
        border-color: rgba(235, 242, 251, .38);
        border-style: solid;
      }
      .corner.tl { left: 60px; top: 58px; border-width: 2px 0 0 2px; }
      .corner.tr { right: 60px; top: 58px; border-width: 2px 2px 0 0; }
      .corner.bl { left: 60px; bottom: 58px; border-width: 0 0 2px 2px; }
      .corner.br { right: 60px; bottom: 58px; border-width: 0 2px 2px 0; }
      .film-bar {
        position: absolute;
        left: 0;
        right: 0;
        z-index: 10;
        height: 42px;
        background: #000;
      }
      .film-bar.top { top: 0; }
      .film-bar.bottom { bottom: 0; }
      .progress-line {
        position: absolute;
        left: 0;
        bottom: 42px;
        width: 100%;
        height: 3px;
        transform-origin: left center;
        background: linear-gradient(90deg, var(--red), rgba(198, 47, 70, .08));
        opacity: .65;
      }
      .layout-1 .scene-scrim {
        background:
          radial-gradient(circle at 50% 44%, transparent 20%, rgba(2, 4, 10, .16) 58%, rgba(2, 4, 10, .52) 100%),
          linear-gradient(180deg, rgba(0, 0, 0, .18), transparent 28%, transparent 70%, rgba(0, 0, 0, .58));
      }

      function sceneMarkup(scene) {
        const visuals = visualSequences[scene.id] || [{ src: scene.asset, focus: scene.focus }];
        const images = visuals.map((visual, index) =>
          `<img class="scene-image" data-visual-index="${index}" data-zoom="${visual.zoom || ""}" data-x="${visual.x || 0}" data-y="${visual.y || 0}" src="${visual.src}" alt="" style="object-position:${visual.focus}">`
        ).join("");
        return `
          <section id="scene-${scene.id}" class="scene clip layout-${scene.index % 4}" data-start="${scene.start}" data-duration="${scene.duration}" data-type="${scene.type}" style="visibility:hidden;opacity:0">
            ${images}
            <div class="scene-scrim"></div>
            <div class="scene-glow"></div>
            <div class="grain"></div>
            <div class="mist"></div>
            <div class="scanline"></div>
            <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
          </section>`;
      }

      host.innerHTML = window.HF_SCENES.map(sceneMarkup).join("");
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out" } });
      tl.set(".progress-line", { scaleX: 0 }, 0);

      window.HF_SCENES.forEach((scene, sceneIndex) => {
        const el = document.getElementById(`scene-${scene.id}`);
        const images = Array.from(el.querySelectorAll(".scene-image"));
        const scanline = el.querySelector(".scanline");
        const glow = el.querySelector(".scene-glow");
        const mist = el.querySelector(".mist");
        const start = Number(scene.start);
        const duration = Number(scene.duration);
        const end = Number(scene.end);
        const direction = sceneIndex % 2 === 0 ? 1 : -1;

        tl.set(el, { autoAlpha: 1 }, start);
        const visualDuration = duration / images.length;
        images.forEach((image, imageIndex) => {
          const visualStart = start + imageIndex * visualDuration;
          const isReferenceSheet = image.src.includes("wolyeongjae-reference");
          const zoom = Number(image.dataset.zoom) || (isReferenceSheet ? 1.58 : 1.08);
          const xOffset = Number(image.dataset.x) || 0;
          const yOffset = Number(image.dataset.y) || 0;
          tl.set(image, { autoAlpha: imageIndex === 0 ? 1 : 0 }, start);
          if (imageIndex > 0) {
            tl.to(image, { autoAlpha: 1, duration: .72, ease: "power1.inOut" }, visualStart);
          }
          tl.fromTo(image,
            { scale: zoom, xPercent: xOffset - 1.5 * direction, yPercent: yOffset + sceneIndex % 3 - 1, filter: "saturate(.76) contrast(1.13) brightness(.76)" },
            { scale: zoom + .075, xPercent: xOffset + 1.8 * direction, yPercent: yOffset + 1 - sceneIndex % 3, filter: "saturate(.86) contrast(1.08) brightness(.92)", duration: visualDuration + .15, ease: "none" },
            visualStart
          );
        });
        tl.fromTo(mist, { xPercent: -8, opacity: .12 }, { xPercent: 8, opacity: .28, duration, ease: "sine.inOut" }, start);
        tl.to(".progress-line", { scaleX: end / 1153.031, duration, ease: "none" }, start);

        for (let beat = 2.5, step = 0; beat < duration - 2.2; beat += 2.5, step += 1) {
          const at = start + beat;
          tl.fromTo(scanline, { y: -80, autoAlpha: 0 }, { y: 1160, autoAlpha: .8, duration: 1.15, ease: "none" }, at);
          tl.to(glow, { x: 70 * direction * ((step % 3) - 1), y: 42 * ((step % 2) ? 1 : -1), duration: 2.1, ease: "sine.inOut" }, at);
        }

        tl.to(el, { autoAlpha: 0, duration: .42, ease: "power1.in" }, Math.max(start, end - .42));
        tl.set(el, { visibility: "hidden" }, end);
      });

      tl.to({}, { duration: .001 }, 1153.03);
      window.__timelines["youtube-master"] = tl;
