<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>고시원 공용 샤워실, 칸막이 아래 발이 두 켤레였다</title>
  <style>
    @font-face{font-family:AppleSD;src:local("Apple SD Gothic Neo")}
    :root{--black:#020407;--deep:#071318;--teal:#10252a;--ink:#e8edf0;--red:#ff334f}
    *{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--black);color:var(--ink);font-family:AppleSD,Arial,sans-serif}
    #master,.scene,.scene-image,.scrim,.grain,.scan,.cast,.drip,.overlay{position:absolute;inset:0}
    #master{width:1920px;height:1080px;overflow:hidden;background:var(--black)}
    .scene{visibility:hidden;opacity:0;overflow:hidden;background:#020407}
    .scene-image{width:100%;height:100%;object-fit:cover;opacity:0;will-change:transform,opacity,filter}
    .scrim{background:linear-gradient(90deg,rgba(1,3,5,.78),rgba(1,3,5,.14) 48%,rgba(1,3,5,.38)),linear-gradient(180deg,rgba(0,0,0,.22),transparent 52%,rgba(0,0,0,.62));z-index:2}
    .cast{z-index:3;inset:-15%;background:radial-gradient(circle at 70% 48%,rgba(40,112,110,.10),transparent 24%),radial-gradient(circle at 22% 70%,rgba(255,51,79,.06),transparent 18%)}
    .grain{z-index:8;opacity:.16;background-image:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.035) 3px 4px);pointer-events:none}
    .scan{z-index:7;top:-180px;height:150px;background:linear-gradient(180deg,transparent,rgba(149,235,221,.08),transparent);opacity:0}
    .drip{z-index:6;left:58%;top:-40px;width:3px;height:160px;background:linear-gradient(rgba(180,230,220,.0),rgba(180,230,220,.55));opacity:.0}
    .overlay{z-index:5}.glass{background:rgba(3,10,13,.62);border:1px solid rgba(215,240,236,.19);box-shadow:0 20px 70px rgba(0,0,0,.46);backdrop-filter:blur(12px)}
    .eyebrow{font-size:20px;font-weight:900;letter-spacing:.2em;color:#8bd8cb;margin-bottom:18px}
    .headline{font-size:58px;line-height:1.13;font-weight:900;letter-spacing:-.045em;word-break:keep-all;text-shadow:0 8px 30px #000}.red{color:var(--red)}
    .copy{position:absolute;left:110px;top:190px;width:860px;padding:34px 38px;border-radius:16px}.copy.right{left:auto;right:100px;width:730px}
    .hook{position:absolute;left:115px;top:175px;width:1120px}.hook .headline{font-size:64px}
    .stalls{position:absolute;right:120px;top:210px;width:620px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .stall{height:430px;border-radius:8px;border:3px solid rgba(222,235,232,.35);background:linear-gradient(#0b1618,#020304)}.stall.dead{border-color:var(--red);box-shadow:0 0 34px rgba(255,51,79,.35)}
    .led{position:absolute;right:170px;top:220px;width:28px;height:28px;border-radius:50%;background:var(--red);box-shadow:0 0 28px var(--red)}
    .slipper{position:absolute;right:210px;bottom:160px;width:280px;height:90px;border-radius:40px 70px 70px 40px;background:rgba(120,130,135,.55);box-shadow:0 0 30px rgba(255,51,79,.18)}
    .phone{position:absolute;left:125px;top:165px;width:420px;height:760px;border:13px solid #090d10;border-radius:58px;background:linear-gradient(160deg,#0b1920,#020304);box-shadow:0 40px 100px #000}
    .phone .msg{margin:140px 28px 0;padding:22px;border-radius:16px;background:#102226;font-size:28px;font-weight:800;line-height:1.35}
    .phone .msg.warn{color:var(--red);margin-top:18px}
    .hand{position:absolute;right:160px;top:180px;width:520px;height:520px;border:4px solid rgba(255,51,79,.55);border-radius:50%;box-shadow:0 0 70px rgba(255,51,79,.28),inset 0 0 55px rgba(255,51,79,.16)}
    .feet-line{position:absolute;left:160px;right:160px;bottom:150px;height:8px;background:linear-gradient(90deg,transparent,#d8e6e3 18% 72%,transparent)}
    .warning{position:absolute;left:160px;right:160px;top:230px;text-align:center}.warning .headline{font-size:62px}
    .lock-icon{width:210px;height:170px;margin:46px auto 0;border:12px solid var(--red);border-radius:22px;position:relative}.lock-icon:before{content:"";position:absolute;left:38px;top:-120px;width:110px;height:120px;border:12px solid var(--red);border-bottom:0;border-radius:65px 65px 0 0}
    .ending{position:absolute;left:120px;top:180px;width:920px}.ending .headline{font-size:62px}
    .door-gap{position:absolute;right:160px;bottom:110px;width:520px;height:180px;border-radius:50%;border:5px solid rgba(196,238,230,.45);filter:blur(2px);box-shadow:0 0 60px rgba(170,235,225,.2)}
    .end-card{position:absolute;left:105px;bottom:95px;width:750px;padding:26px 32px;background:rgba(1,4,6,.78);border-left:5px solid #8bd8cb;opacity:0}.end-card b{display:block;font-size:24px;color:#8bd8cb;letter-spacing:.12em}.end-card span{display:block;margin-top:12px;font-size:38px;font-weight:900;line-height:1.18}
    .outro-black{position:absolute;inset:0;background:#000;opacity:0}.outro-word{position:absolute;left:0;right:0;top:470px;text-align:center;font-size:42px;font-weight:900;letter-spacing:-.03em}
  </style>
</head>
<body>
  <main id="master" data-composition-id="youtube-master" data-width="1920" data-height="1080" data-start="0" data-duration="440.697">
    <audio id="voice" data-start="0" data-duration="440.697" data-track-index="0" src="assets/audio/voice.wav" data-volume="1"></audio>
    <div id="scene-host"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="scene-data.js"></script>
  <script>
    const DURATION=440.697,A="assets/visuals/";
    function overlay(s){
      if(s.overlay==="hook")return `<div class="overlay"><div class="hook"><div class="eyebrow reveal">공용 샤워실 · 왼쪽 칸</div><div class="headline reveal">칸막이 아래에<br><span class="red">발이 두 켤레였다</span></div></div></div>`;
      if(s.overlay==="setup")return `<div class="overlay"><div class="copy glass reveal"><div class="eyebrow">삼백칠 호 · 정상 규칙</div><div class="headline">가운데 칸은 쓰지 마요.<br><span class="red">젖은 슬리퍼도.</span></div></div><div class="stalls"><i class="stall"></i><i class="stall dead"></i><i class="stall"></i></div></div>`;
      if(s.overlay==="anomaly")return `<div class="overlay"><div class="copy glass reveal"><div class="eyebrow">첫 번째 이상</div><div class="headline">마른 복도에<br><span class="red">맨발 자국만 이어져 있었다</span></div></div><div class="led"></div><div class="slipper"></div></div>`;
      if(s.overlay==="chat")return `<div class="overlay"><div class="phone reveal"><div class="msg">그거 치우지 마요.</div><div class="msg warn">오늘은 씻지 말고 방으로 들어가요.</div></div><div class="copy right glass reveal"><div class="eyebrow">관리인 단톡</div><div class="headline">읽음만 표시되고<br><span class="red">답이 없었다</span></div></div></div>`;
      if(s.overlay==="mirror")return `<div class="overlay"><div class="copy glass reveal"><div class="eyebrow">김 서린 거울</div><div class="headline">안쪽에서 누른<br><span class="red">손자국이었다</span></div></div><div class="hand"></div></div>`;
      if(s.overlay==="feet")return `<div class="overlay"><div class="copy glass reveal"><div class="eyebrow">칸막이 아래</div><div class="headline">두 발은 나와<br><span class="red">같은 방향을 보고 있었다</span></div></div><div class="feet-line"></div></div>`;
      if(s.overlay==="hair")return `<div class="overlay"><div class="warning"><div class="eyebrow reveal">가운데 칸</div><div class="headline reveal">얼굴이 있어야 할 자리에는<br><span class="red">머리만 붙어 있었다</span></div></div></div>`;
      if(s.overlay==="grab")return `<div class="overlay"><div class="copy glass reveal"><div class="eyebrow">직접 접촉</div><div class="headline">귓가에서 물속 목소리가<br><span class="red">삼백칠 호를 불렀다</span></div></div><div class="hand"></div></div>`;
      if(s.overlay==="escape")return `<div class="overlay"><div class="copy glass reveal"><div class="eyebrow">복도</div><div class="headline">내 방 앞에<br><span class="red">회색 슬리퍼가 놓여 있었다</span></div></div><div class="slipper"></div></div>`;
      if(s.overlay==="manager")return `<div class="overlay"><div class="warning"><div class="eyebrow reveal">관리인의 말</div><div class="headline reveal">열면 물이 먼저 나와요.<br><span class="red">사람이 아니라.</span></div><div class="lock-icon"></div></div></div>`;
      if(s.overlay==="ending")return `<div class="overlay"><div class="ending"><div class="eyebrow reveal">새 집 화장실</div><div class="headline reveal">회색 슬리퍼 코가<br><span class="red">안쪽에서 밀리고 있다</span></div></div><div class="door-gap"></div><div class="end-card"><b>다음 이야기</b><span>텐트 밖에서<br>친구 목소리를 흉내 내는 것</span></div></div>`;
      return `<div class="overlay"><div class="outro-word reveal">배수구가 다시 꿀렁거렸다</div><div class="outro-black"></div></div>`;
    }
    function markup(s){const imgs=s.visuals.map((n,i)=>`<img class="scene-image" data-i="${i}" src="${A+n}.png" alt="">`).join("");return `<section id="scene-${s.id}" class="scene">${imgs}${overlay(s)}<div class="scrim"></div><div class="cast"></div><div class="grain"></div><div class="scan"></div><div class="drip"></div></section>`}
    document.getElementById("scene-host").innerHTML=window.HF_SCENES.map(markup).join("");
    window.__timelines=window.__timelines||{};
    const tl=gsap.timeline({paused:true,defaults:{ease:"power2.out"}});
    window.HF_SCENES.forEach((s,si)=>{
      const el=document.getElementById(`scene-${s.id}`),imgs=[...el.querySelectorAll(".scene-image")],st=s.start,en=s.end,d=s.duration,slot=d/Math.max(1,imgs.length);
      tl.set(el,{visibility:"visible",autoAlpha:1},st);
      imgs.forEach((img,i)=>{const at=st+i*slot,dir=(si+i)%2?1:-1,isEnd=s.overlay==="ending"||s.overlay==="outro";tl.set(img,{autoAlpha:i?0:1},st);if(i)tl.to(img,{autoAlpha:1,duration:.7},at);tl.fromTo(img,{scale:1.05,xPercent:-2*dir,yPercent:(i%3)-1,filter:isEnd?"saturate(.78) contrast(1.08) brightness(1.05)":"saturate(.7) contrast(1.16) brightness(.7)"},{scale:1.17,xPercent:2.4*dir,yPercent:1-(i%3),filter:isEnd?"saturate(.92) contrast(1.04) brightness(1.16)":"saturate(.9) contrast(1.08) brightness(.9)",duration:slot+.3,ease:"none"},at);if(i<imgs.length-1)tl.to(img,{autoAlpha:0,duration:.7},at+slot-.7)});
      el.querySelectorAll(".reveal").forEach((n,i)=>tl.fromTo(n,{autoAlpha:0,y:20},{autoAlpha:1,y:0,duration:.55},st+.12+Math.min(i*.72,Math.max(.2,d-1))));
      const scan=el.querySelector(".scan"),drip=el.querySelector(".drip"),cast=el.querySelector(".cast");
      tl.to(cast,{xPercent:si%2?14:-14,duration:d,ease:"sine.inOut"},st);
      for(let t=1.7,n=0;t<d-.3;t+=2.5,n++){tl.fromTo(scan,{autoAlpha:0,y:0},{autoAlpha:.5,y:1260,duration:1.0,ease:"none"},st+t);tl.fromTo(drip,{autoAlpha:.0,y:0},{autoAlpha:.7,y:980,duration:1.15,ease:"sine.in"},st+t+.2)}
      if(s.overlay==="setup")el.querySelectorAll(".stall").forEach((m,i)=>tl.fromTo(m,{filter:"brightness(.45)"},{filter:i===1?"brightness(.7) drop-shadow(0 0 8px #ff334f)":"brightness(1)",duration:.4},st+1.2+i*.35));
      if(s.overlay==="anomaly"||s.overlay==="grab")tl.fromTo(el.querySelector(".led, .hand"),{scale:.7,autoAlpha:.25},{scale:1.08,autoAlpha:.9,duration:1.2,yoyo:true,repeat:Math.max(6,Math.floor(d/2.4))},st+1);
      if(s.overlay==="chat")tl.fromTo(el.querySelector(".phone"),{y:40,autoAlpha:0},{y:0,autoAlpha:1,duration:.7},st+.4);
      if(s.overlay==="mirror"||s.overlay==="feet")tl.fromTo(el.querySelector(".hand, .feet-line"),{scaleX:.2,autoAlpha:.2},{scaleX:1,autoAlpha:.85,duration:1.4},st+1.1);
      if(s.overlay==="manager")tl.fromTo(el.querySelector(".lock-icon"),{scale:.75,autoAlpha:.3},{scale:1.05,autoAlpha:.95,duration:1.1,yoyo:true,repeat:Math.max(8,Math.floor(d/2.2))},st+1.6);
      if(s.overlay==="ending")tl.fromTo(el.querySelector(".end-card"),{autoAlpha:0,x:-22},{autoAlpha:1,x:0,duration:.8},Math.max(st+2,en-18));
      if(s.overlay==="outro")tl.to(el.querySelector(".outro-black"),{autoAlpha:.22,duration:1.0},st+.4).to(el.querySelector(".outro-black"),{autoAlpha:1,duration:2.4,ease:"power1.in"},en-2.4);
      if(s.overlay!=="outro")tl.to(el,{autoAlpha:0,duration:.34},en-.34).set(el,{visibility:"hidden"},en);else tl.set(el,{visibility:"hidden"},en);
    });
    tl.to({},{duration:.001},DURATION);window.__timelines["youtube-master"]=tl;
  </script>
</body>
</html>
