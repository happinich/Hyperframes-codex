<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>새벽 배달기사가 본 문 앞의 나</title>
<style>
@font-face{font-family:"Apple SD Gothic Neo";src:local("Apple SD Gothic Neo")}
:root{--bg:#020407;--ink:#edf5f4;--muted:#9badb0;--teal:#70d5c6;--red:#ff334f}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}body{font-family:"Apple SD Gothic Neo",Arial,sans-serif;color:var(--ink)}
#master{position:relative;width:1920px;height:1080px;overflow:hidden;isolation:isolate;background:#000}.clip{visibility:hidden;opacity:0}.scene{position:absolute;inset:0;overflow:hidden;background:var(--bg)}
.scene-image{position:absolute;inset:-5%;width:110%;height:110%;object-fit:cover;opacity:0;filter:saturate(.72) contrast(1.13) brightness(.72);will-change:transform,filter,opacity}
.scrim{position:absolute;z-index:1;inset:0;background:radial-gradient(circle at 52% 44%,transparent 8%,rgba(1,3,6,.12) 45%,rgba(1,3,6,.84) 100%),linear-gradient(180deg,rgba(0,0,0,.2),transparent 30%,transparent 66%,rgba(0,0,0,.74))}
.cast{position:absolute;z-index:1;inset:-15%;background:radial-gradient(circle at 30% 42%,rgba(36,109,102,.22),transparent 32%),radial-gradient(circle at 76% 56%,rgba(255,51,79,.09),transparent 24%);mix-blend-mode:screen}.grain{position:absolute;z-index:7;inset:0;opacity:.11;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.035) 3px 4px)}
.scan{position:absolute;z-index:6;left:0;right:0;top:-140px;height:110px;background:linear-gradient(transparent,rgba(139,235,218,.12),transparent);mix-blend-mode:screen;opacity:0}.pulse{position:absolute;z-index:2;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(255,51,79,.12),transparent 68%);filter:blur(8px);opacity:0}
.overlay{position:absolute;z-index:5;inset:0}.reveal{opacity:0}.red{color:var(--red)}.teal{color:var(--teal)}.glass{background:rgba(3,9,12,.79);border:1px solid rgba(198,234,229,.18);box-shadow:0 28px 90px rgba(0,0,0,.5);backdrop-filter:blur(10px)}
.eyebrow{font-size:24px;font-weight:800;letter-spacing:.16em;color:var(--teal)}.headline{font-size:68px;font-weight:900;line-height:1.14;letter-spacing:-.05em;word-break:keep-all;text-shadow:0 8px 35px #000}.sub{margin-top:20px;color:var(--muted);font-size:28px;font-weight:700;line-height:1.45}
.hook{position:absolute;left:142px;top:175px;width:1080px}.hook .time{font:900 40px/1 monospace;color:var(--red)}.hook h1{margin:32px 0 0;font-size:78px;line-height:1.13;letter-spacing:-.055em}.wave{display:flex;align-items:center;gap:7px;width:570px;height:90px;margin-top:34px}.wave i{width:7px;background:var(--teal);border-radius:8px;transform-origin:center}
.twocol{position:absolute;left:180px;right:180px;bottom:165px;display:grid;grid-template-columns:1fr 1fr;gap:26px}.card{padding:34px 42px;font-size:28px;color:var(--muted)}.card b{display:block;margin-top:10px;font-size:56px;color:var(--ink)}.card.hot{border-color:rgba(255,51,79,.55)}.card.hot b{color:var(--red)}
.copy{position:absolute;left:145px;top:190px;width:880px;padding:42px}.copy .headline{font-size:60px}.meter{position:absolute;right:180px;top:165px;width:500px;height:620px}.ring{position:absolute;left:80px;top:65px;width:330px;height:330px;border-radius:50%;border:3px solid rgba(112,213,198,.5);box-shadow:0 0 70px rgba(112,213,198,.15)}.axis{position:absolute;left:245px;top:35px;width:6px;height:460px;background:linear-gradient(var(--red),transparent);transform-origin:50% 72%}
.phone{position:absolute;left:610px;top:125px;width:700px;height:800px;padding:50px;border-radius:52px;background:rgba(2,7,10,.92);border:2px solid rgba(194,229,224,.2);box-shadow:0 40px 130px #000}.notch{width:170px;height:20px;margin:0 auto 55px;border-radius:20px;background:#0e1a1f}.status{display:flex;justify-content:space-between;color:var(--muted);font-size:24px}.order{margin-top:86px;color:var(--red);font-size:28px;font-weight:800;letter-spacing:.12em}.order-main{margin-top:22px;font-size:68px;font-weight:900;line-height:1.15}.route-mini{position:absolute;left:72px;right:72px;bottom:100px;height:90px}.route-mini:before{content:"";position:absolute;left:30px;right:30px;top:43px;height:5px;background:rgba(112,213,198,.3);transform-origin:left}.dot{position:absolute;top:27px;width:38px;height:38px;border:6px solid var(--teal);border-radius:50%;background:#061116}.dot.end{right:30px;border-color:var(--red);box-shadow:0 0 30px var(--red)}
.door-axis{position:absolute;right:160px;top:150px;width:540px;height:700px;border-left:3px solid rgba(112,213,198,.34)}.door-axis:before{content:"현관문";position:absolute;left:-55px;top:-45px;color:var(--muted);font-size:23px}.angle{position:absolute;left:130px;top:220px;width:260px;height:6px;background:var(--red);transform-origin:left}
.chat{position:absolute;left:270px;right:270px;top:210px}.bubble{max-width:1080px;padding:30px 38px;border-radius:28px;font-size:42px;font-weight:800;line-height:1.3}.bubble.sent{margin-left:auto;border:1px solid rgba(255,51,79,.55);background:rgba(46,4,12,.86)}.bubble.note{margin-top:34px;color:var(--muted);font-size:29px}.cursor{display:inline-block;width:4px;height:48px;background:var(--red);vertical-align:middle}
.lockgrid{position:absolute;left:170px;right:170px;top:235px;display:grid;grid-template-columns:1fr 120px 1fr;gap:28px;align-items:center}.lock{height:430px;padding:46px;text-align:center}.lock h2{font-size:36px;color:var(--muted)}.lock b{display:block;margin-top:90px;font-size:68px}.lock.out b,.neq{color:var(--red)}.lock.in b{color:var(--teal)}.neq{text-align:center;font-size:78px;font-weight:900}.alert{position:absolute;left:520px;right:520px;bottom:135px;padding:25px;text-align:center;font-size:42px;font-weight:900;border-color:rgba(255,51,79,.5)}
.drag{position:absolute;left:210px;right:210px;bottom:230px;height:180px}.dragline{position:absolute;left:0;top:90px;width:100%;height:6px;background:linear-gradient(90deg,var(--teal),var(--red));transform-origin:left}.foot{position:absolute;width:44px;height:78px;border-radius:48% 48% 40% 40%;background:rgba(255,51,79,.58);box-shadow:0 0 25px rgba(255,51,79,.35);opacity:0}
.proof{position:absolute;left:150px;right:150px;top:110px;bottom:110px;border:10px solid rgba(233,245,243,.9);box-shadow:0 30px 100px #000}.proof:before{content:"DELIVERY PROOF";position:absolute;left:28px;top:24px;padding:12px 18px;background:rgba(2,4,7,.72);color:var(--red);font:800 20px/1 monospace}.marker{position:absolute;right:190px;bottom:150px;padding:24px 30px;font-size:32px;font-weight:900;border-color:rgba(255,51,79,.55)}
.double{position:absolute;left:170px;right:170px;top:210px;display:grid;grid-template-columns:1fr 1fr;gap:28px}.double .card{height:540px;position:relative}.sil{position:absolute;left:50%;bottom:0;width:180px;height:390px;transform:translateX(-50%);background:linear-gradient(#15282c,#020407);clip-path:polygon(34% 0,66% 0,75% 16%,83% 48%,100% 100%,0 100%,17% 48%,25% 16%)}.evidence{display:flex;gap:18px;margin-top:32px}.evidence span{padding:15px 22px;border:1px solid rgba(255,255,255,.14);color:var(--muted);font-size:23px}.evidence .hot{border-color:var(--red);color:var(--red)}
.ending-route{position:absolute;left:150px;right:150px;top:220px;height:430px}.route-line{position:absolute;left:180px;right:180px;top:210px;height:7px;background:linear-gradient(90deg,var(--teal),var(--red));transform-origin:left}.node{position:absolute;top:135px;width:180px;height:180px;border-radius:50%;display:grid;place-items:center;text-align:center;font-size:26px;font-weight:900;background:rgba(3,9,12,.92);border:3px solid var(--teal)}.node.old{left:90px}.node.new{right:90px;border-color:var(--red);box-shadow:0 0 55px rgba(255,51,79,.3)}.courier{position:absolute;left:230px;top:188px;width:52px;height:52px;border-radius:50%;background:var(--red);box-shadow:0 0 36px var(--red)}.ending-copy{position:absolute;left:250px;right:250px;bottom:120px;text-align:center}.ending-copy .headline{font-size:62px}.outro-black{position:absolute;inset:0;background:#000;opacity:0}.outro-word{position:absolute;left:0;right:0;top:450px;text-align:center;font-size:46px;font-weight:900}
</style></head>
<body><main id="master" data-composition-id="youtube-master" data-width="1920" data-height="1080" data-start="0" data-duration="367.033"><audio id="voice" data-start="0" data-duration="367.033" data-track-index="0" src="assets/audio/voice.wav" data-volume="1"></audio><div id="scene-host"></div></main>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script><script src="scene-data.js"></script><script>
const DURATION=367.033,A="assets/visuals/";const bars=()=>Array.from({length:42},(_,i)=>`<i style="height:${25+(i*37)%72}px"></i>`).join("");
function overlay(s){let o=s.overlay;
if(o==="hook")return `<div class="overlay"><div class="hook"><div class="time reveal">새벽 두 시 사십사 분</div><h1 class="reveal">“문 앞에 계시면서<br><span class="red">왜 전화를 안 받으세요?</span>”</h1><div class="wave">${bars()}</div></div></div>`;
if(o==="identity")return `<div class="overlay"><div class="twocol"><div class="card glass reveal">침대 위의 나<b>회색 운동복 · 맨발</b></div><div class="card hot glass reveal">문 앞의 사람<b>회색 운동복 · 맨발</b></div></div></div>`;
if(o==="voice")return `<div class="overlay"><div class="copy glass reveal"><div class="eyebrow">VOICE REACTION</div><div class="headline">내 목소리가 날 때마다<br><span class="red">고개를 들었다</span></div></div><div class="meter"><div class="ring"></div><div class="axis"></div></div></div>`;
if(o==="order")return `<div class="overlay"><div class="phone reveal"><div class="notch"></div><div class="status"><span>ORDER RECEIVED</span><span class="red">ARRIVED</span></div><div class="order">주문하지 않은 배달</div><div class="order-main">빈 그릇 하나<br><span class="red">직접 전달</span></div><div class="route-mini"><div class="dot"></div><div class="dot end"></div></div></div></div>`;
if(o==="posture")return `<div class="overlay"><div class="copy glass reveal"><div class="eyebrow">POSTURE ERROR</div><div class="headline">등은 문에 붙어 있는데<br><span class="red">고개만 집 안을 봤다</span></div></div><div class="door-axis"><div class="angle"></div></div></div>`;
if(o==="chat")return `<div class="overlay"><div class="chat"><div class="bubble sent reveal">문 앞에 두지 마세요.<br><span class="red">안으로 가져와 주세요.</span><span class="cursor"></span></div><div class="bubble note glass reveal">보낸 사람 · 내 계정<br>작성한 사람 · 알 수 없음</div></div></div>`;
if(o==="lock")return `<div class="overlay"><div class="lockgrid"><div class="lock out glass reveal"><h2>복도에서 본 문</h2><b>OPEN</b></div><div class="neq reveal">≠</div><div class="lock in glass reveal"><h2>집 안에서 본 문</h2><b>CLOSED</b></div></div><div class="alert glass reveal">실내 수동 열림</div></div>`;
if(o==="intrusion")return `<div class="overlay"><div class="copy reveal"><div class="eyebrow">INSIDE THE ROOM</div><div class="headline">사각. 사각.<br><span class="red">발끝은 네 개였다</span></div></div><div class="drag"><div class="dragline"></div>${Array.from({length:4},(_,i)=>`<i class="foot" style="right:${150+i*75}px;top:${i%2?22:72}px;transform:rotate(${i%2?-12:12}deg)"></i>`).join("")}</div></div>`;
if(o==="proof")return `<div class="overlay"><div class="proof reveal"></div><div class="marker glass reveal">촬영 위치 · 원룸 안쪽</div></div>`;
if(o==="double")return `<div class="overlay"><div class="double"><div class="card glass reveal">사진을 찍은 사람<div class="sil"></div></div><div class="card hot glass reveal">화장실 문 앞의 사람<div class="sil"></div></div></div></div>`;
if(o==="aftermath")return `<div class="overlay"><div class="copy glass reveal"><div class="eyebrow">AFTERMATH</div><div class="headline">집 안에는 아무도 없었다.<br><span class="red">빈 그릇만 젖어 있었다.</span></div><div class="evidence"><span>문 잠김</span><span>침입 흔적 없음</span><span class="hot">빈 그릇 하나</span></div></div></div>`;
if(o==="ending")return `<div class="overlay"><div class="ending-route"><div class="route-line"></div><div class="node old reveal">옛 원룸<br>출발</div><div class="node new reveal">새집<br>도착</div><div class="courier"></div></div><div class="ending-copy"><div class="eyebrow reveal">RETURN ORDER</div><div class="headline reveal">빈 그릇 회수<br><span class="red">직접 전달</span></div></div></div>`;
return `<div class="overlay"><div class="outro-word reveal">이미 문 앞에 도착했습니다</div><div class="outro-black"></div></div>`}
function markup(s){let imgs=s.visuals.map((n,i)=>`<img class="scene-image" data-i="${i}" src="${A+n}.png" alt="">`).join("");return `<section id="scene-${s.id}" class="scene clip" data-start="${s.start}" data-duration="${s.duration}">${imgs}${overlay(s)}<div class="scrim"></div><div class="cast"></div><div class="grain"></div><div class="scan"></div><div class="pulse"></div></section>`}
document.getElementById("scene-host").innerHTML=window.HF_SCENES.map(markup).join("");window.__timelines=window.__timelines||{};const tl=gsap.timeline({paused:true,defaults:{ease:"power2.out"}});
window.HF_SCENES.forEach((s,si)=>{let el=document.getElementById(`scene-${s.id}`),imgs=[...el.querySelectorAll(".scene-image")],st=s.start,en=s.end,d=s.duration,slot=d/Math.max(1,imgs.length);tl.set(el,{autoAlpha:1},st);
imgs.forEach((img,i)=>{let at=st+i*slot,dir=(si+i)%2?1:-1;tl.set(img,{autoAlpha:i?0:1},st);if(i)tl.to(img,{autoAlpha:1,duration:.65},at);tl.fromTo(img,{scale:1.07,xPercent:-2*dir,yPercent:(i%3)-1,filter:"saturate(.64) contrast(1.18) brightness(.62)"},{scale:1.19,xPercent:2.4*dir,yPercent:1-(i%3),filter:"saturate(.82) contrast(1.1) brightness(.82)",duration:slot+.25,ease:"none"},at);if(i<imgs.length-1)tl.to(img,{autoAlpha:0,duration:.65},at+slot-.65)});
el.querySelectorAll(".reveal").forEach((n,i)=>tl.fromTo(n,{autoAlpha:0,y:20},{autoAlpha:1,y:0,duration:.55},st+.08+Math.min(i*.85,Math.max(.2,d-1))));let scan=el.querySelector(".scan"),pulse=el.querySelector(".pulse"),cast=el.querySelector(".cast");tl.to(cast,{xPercent:si%2?16:-16,duration:d,ease:"sine.inOut"},st);for(let t=2.1,n=0;t<d-.3;t+=2.7,n++){tl.fromTo(scan,{autoAlpha:0,y:0},{autoAlpha:.62,y:1230,duration:1.05,ease:"none"},st+t);tl.fromTo(pulse,{autoAlpha:.48,scale:.25,x:110+(n*347)%1550,y:90+(n*211)%720},{autoAlpha:0,scale:3.2,duration:1.25},st+t+.18)}
if(s.overlay==="hook")el.querySelectorAll(".wave i").forEach((b,i)=>tl.fromTo(b,{scaleY:.22,autoAlpha:.2},{scaleY:1,autoAlpha:.9,duration:.19,yoyo:true,repeat:11},st+1.5+(i%11)*.08));
if(s.overlay==="voice")for(let t=2;t<d-1;t+=3)tl.to(el.querySelector(".axis"),{rotation:-38,duration:.55,yoyo:true,repeat:1},st+t);
if(s.overlay==="order")tl.fromTo(el.querySelector(".route-mini"),{scaleX:.15},{scaleX:1,duration:4},st+3).fromTo(el.querySelector(".dot.end"),{scale:.2},{scale:1.3,duration:.3,yoyo:true,repeat:5},st+7);
if(s.overlay==="posture")tl.fromTo(el.querySelector(".angle"),{rotation:0},{rotation:-58,duration:2.6},st+3);
if(s.overlay==="chat")tl.fromTo(el.querySelector(".cursor"),{autoAlpha:0},{autoAlpha:1,duration:.25,yoyo:true,repeat:15},st+1);
if(s.overlay==="lock")tl.fromTo(el.querySelector(".alert"),{scale:.96},{scale:1.03,duration:.42,yoyo:true,repeat:6},st+5);
if(s.overlay==="intrusion"){tl.fromTo(el.querySelector(".dragline"),{scaleX:0},{scaleX:1,duration:5},st+2);el.querySelectorAll(".foot").forEach((n,i)=>tl.to(n,{autoAlpha:1,duration:.25},st+7+i*.8))}
if(s.overlay==="proof")tl.fromTo(el.querySelector(".proof"),{scale:1.06,rotation:-.4},{scale:1,rotation:0,duration:3},st+.5);
if(s.overlay==="double")el.querySelectorAll(".sil").forEach((n,i)=>tl.fromTo(n,{scale:.9,filter:"brightness(.5)"},{scale:1.04,filter:i?"drop-shadow(0 0 35px rgba(255,51,79,.55))":"brightness(.9)",duration:4,yoyo:true,repeat:Math.max(1,Math.floor(d/8))},st+1+i));
if(s.overlay==="ending"){tl.fromTo(el.querySelector(".route-line"),{scaleX:0},{scaleX:1,duration:5},st+2);tl.to(el.querySelector(".courier"),{x:1240,duration:10,ease:"power1.inOut"},st+5).fromTo(el.querySelector(".node.new"),{scale:.9},{scale:1.12,duration:.45,yoyo:true,repeat:9},st+15)}
if(s.overlay==="outro")tl.to(el.querySelector(".outro-black"),{autoAlpha:1,duration:3,ease:"power1.in"},st+1);tl.to(el,{autoAlpha:0,duration:Math.min(.32,d*.45)},Math.max(st,en-Math.min(.32,d*.45))).set(el,{visibility:"hidden"},en)});
tl.to({},{duration:.001},DURATION);window.__timelines["youtube-master"]=tl;
</script></body></html>
