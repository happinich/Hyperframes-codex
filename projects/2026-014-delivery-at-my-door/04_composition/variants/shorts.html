<!doctype html>

  <title>사진 속 나는 둘 · Shorts</title>
  <style>
    @font-face{font-family:"Apple SD Gothic Neo";src:local("Apple SD Gothic Neo")}*{box-sizing:border-box}html,body{margin:0;background:#05070a;overflow:hidden;font-family:"Apple SD Gothic Neo",Arial,sans-serif}
    #shorts{position:relative;width:1080px;height:1920px;overflow:hidden;color:#fff;background:#05070a}.scene{position:absolute;inset:0;opacity:0;overflow:hidden}.scene:first-of-type{opacity:1}.bg{position:absolute;inset:-70px;background-position:center;background-size:cover;filter:blur(34px) brightness(.27) saturate(.82);transform:scale(1.16)}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(1,4,7,.94),rgba(1,4,7,.14) 26%,rgba(1,4,7,.18) 65%,rgba(1,4,7,.97) 92%)}
    .visual{position:absolute;left:74px;top:360px;width:932px;height:960px;border:1px solid rgba(255,255,255,.16);border-radius:34px;overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.75)}.visual img{width:100%;height:100%;object-fit:cover;transform:scale(1.07)}.s1 .visual img{object-position:65% center}.s2 .visual img{object-position:63% center}.s3 .visual img{object-position:66% center}.s4 .visual img,.s5 .visual img{object-position:50% center}.visual::after{content:"";position:absolute;inset:0;border:1px solid rgba(85,221,201,.13);box-shadow:inset 0 0 100px rgba(0,0,0,.62)}.scan{position:absolute;z-index:3;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,transparent,#55ddc9,transparent);opacity:.6;box-shadow:0 0 18px #55ddc9}
    .kicker{position:absolute;z-index:8;left:78px;top:146px;font-size:27px;font-weight:900;letter-spacing:.18em;color:#5ce0cc}.clock{position:absolute;z-index:8;right:78px;top:146px;font-size:24px;font-weight:850;color:#a6afbb}.headline{position:absolute;z-index:8;left:78px;right:72px;top:205px;font-size:67px;line-height:1.09;font-weight:900;letter-spacing:-3px;text-shadow:0 6px 26px #000}.headline strong{color:#ff2858}.micro{position:absolute;z-index:5;left:105px;top:392px;padding:12px 18px;border-left:5px solid #ff2858;background:rgba(3,7,11,.84);font-size:24px;font-weight:850;color:#e5ebf1}
    #caption{position:absolute;z-index:10;left:72px;right:72px;top:1390px;min-height:166px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:57px;line-height:1.34;font-weight:900;letter-spacing:-1.7px;color:#fff;word-break:keep-all;text-shadow:-4px -4px 0 #000,4px -4px 0 #000,-4px 4px 0 #000,4px 4px 0 #000,0 8px 24px #000}.rule{position:absolute;z-index:9;left:78px;right:78px;top:1605px;height:3px;background:rgba(255,255,255,.14)}.progress{height:100%;width:0;background:linear-gradient(90deg,#55ddc9,#ff2858);box-shadow:0 0 16px #ff2858}.payoff{position:absolute;z-index:9;left:78px;right:78px;top:1658px;text-align:center;font-size:31px;font-weight:850;color:#b0bac6;opacity:0}.payoff strong{display:block;margin-top:6px;color:#ff2858;font-size:54px}.grain{position:absolute;z-index:20;inset:0;pointer-events:none;opacity:.1;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E")}
  </style>
</head>
<body>
  <div id="shorts" data-composition-id="shorts-master" data-start="0" data-width="1080" data-height="1920" data-duration="27.60">
    <audio id="shorts-audio" data-start="0" data-duration="27.60" data-track-index="0" src="assets/audio/shorts-summary.wav" data-volume="1"></audio>
    <div class="scene s1"><div class="bg" style="background-image:url('assets/visuals/phone-order.png')"></div><div class="shade"></div><div class="visual"><img src="assets/visuals/phone-order.png"><div class="scan"></div></div><div class="micro">배달기사의 전화</div></div>
    <div class="scene s2"><div class="bg" style="background-image:url('assets/visuals/apartment-bedroom-door.png')"></div><div class="shade"></div><div class="visual"><img src="assets/visuals/apartment-bedroom-door.png"><div class="scan"></div></div><div class="micro">나는 집 안 침대에 있었다</div></div>
    <div class="scene s3"><div class="bg" style="background-image:url('assets/visuals/corridor-double.png')"></div><div class="shade"></div><div class="visual"><img src="assets/visuals/corridor-double.png"><div class="scan"></div></div><div class="micro">회색 운동복 · 맨발</div></div>
    <div class="scene s4"><div class="bg" style="background-image:url('assets/visuals/proof-photo.png')"></div><div class="shade"></div><div class="visual"><img src="assets/visuals/proof-photo.png"><div class="scan"></div></div><div class="micro">촬영 위치 · 집 안</div></div>
    <div class="scene s5"><div class="bg" style="background-image:url('assets/visuals/door-shadow.png')"></div><div class="shade"></div><div class="visual"><img src="assets/visuals/door-shadow.png"><div class="scan"></div></div><div class="micro">사진 속 두 사람</div></div>
    <div class="kicker">DELIVERY HORROR</div><div class="clock">새벽 두 시 사십사 분</div><div class="headline">“문 앞에 계시면서<br><strong>왜 전화를 안 받으세요?”</strong></div><div id="caption"></div><div class="rule"><div class="progress"></div></div><div class="payoff">완료 사진 속에는<strong>내가 두 명 있었다</strong></div><div class="grain"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    const cues=[[0,2.98,'“고객님, 문 앞에 계시면서 왜 전화를 안 받으세요?”'],[3.67,6.60,'그런데 저는 그때 집 안 침대에 누워 있었습니다.'],[7.30,9.70,'배달기사는 문 앞에 회색 운동복을 입은'],[9.70,11.72,'사람이 맨발로 서 있다고 했습니다.'],[12.66,14.96,'그날 제가 입고 있던 옷과 똑같았습니다.'],[15.86,18.30,'잠시 뒤 배달 완료 사진이 도착했습니다.'],[19.22,21.58,'그런데 사진은 복도가 아니라'],[21.58,22.86,'제 집 안에서 찍혀 있었습니다.'],[23.42,26.54,'그리고 사진 속에는 제가 두 명 있었습니다.']];
    const tl=gsap.timeline({paused:true});window.__timelines=window.__timelines||{};window.__timelines['shorts-master']=tl;
    const scenes=[['.s1',0,3.67,'“문 앞에 계시면서<br><strong>왜 전화를 안 받으세요?”</strong>'],['.s2',3.32,7.30,'그런데 나는<br><strong>집 안에 있었다</strong>'],['.s3',6.95,15.86,'문 앞의 사람은<br><strong>나와 같은 옷</strong>'],['.s4',15.51,23.42,'완료 사진은<br><strong>집 안에서 찍혔다</strong>'],['.s5',23.07,27.60,'사진 속<br><strong>나는 둘</strong>']];
    scenes.forEach(([selector,start,end,title],index)=>{tl.set(selector,{opacity:1},start);if(index===0)tl.set(`${selector} .visual`,{scale:1,opacity:1},start);else tl.fromTo(`${selector} .visual`,{scale:.97,opacity:0},{scale:1,opacity:1,duration:.4,ease:'power2.out'},start);tl.set('.headline',{innerHTML:title},start).fromTo(`${selector} .visual img`,{scale:1.07,x:index%2?-18:18},{scale:1.18,x:index%2?18:-18,duration:end-start,ease:'none'},start);for(let beat=start+.35;beat<end;beat+=2.5)tl.fromTo(`${selector} .scan`,{y:0,opacity:0},{y:955,opacity:.55,duration:1.65,ease:'none'},beat);if(index<scenes.length-1)tl.to(selector,{opacity:0,duration:.4},end-.35)});
    cues.forEach(([start,end,text])=>{tl.set('#caption',{textContent:text,opacity:1},start).to('#caption',{opacity:.18,duration:.12},end-.12)});tl.to('.progress',{width:'100%',duration:27.6,ease:'none'},0);tl.to('.payoff',{opacity:1,duration:.28},24.84).to('.headline',{opacity:.18,duration:.28},24.84);
  </script>
