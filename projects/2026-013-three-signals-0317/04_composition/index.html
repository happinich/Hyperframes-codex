        if(o==="tunnel")return base(scene,`지난 12년이<br><span class="red">차창 밖으로 지나갔다</span>`).replace('</div></div>','<div class="tunnel-strip"><div class="memory-frame">사고 횡단보도</div><div class="memory-frame">폐차한 택시</div><div class="memory-frame">경찰 조사실</div><div class="memory-frame">집 현관</div></div></div></div>');
        if(o==="empty")return `<div class="overlay"><div class="empty-flow"><div class="empty-box reveal">빈 운전석</div><div class="wet-arrow"></div><div class="empty-box reveal">열린 현관</div></div><div class="system reveal">사람은 없고 젖은 발자국만 남았다</div></div>`;
        if(o==="reservation")return `<div class="overlay"><div class="booking reveal"><div class="kicker">예약 운행</div><div class="booking-row"><span>승차 위치</span><strong>차량 내부</strong></div><div class="booking-row"><span>목적지</span><strong>한빛아파트 107동</strong></div><div class="booking-row"><span>기사</span><strong class="red">이만석</strong></div></div></div>`;
        if(o==="ending")return `<div class="overlay"><div class="time reveal">03:17</div><div class="ending-grid"><div class="ending-node reveal">병원 호출<b>삐</b></div><div class="ending-node reveal">현관 CCTV<b>삐</b></div><div class="ending-node reveal">택시 앱<b>삐</b></div></div><div class="ending-line"></div></div>`;
        if(o==="outro")return `<div class="overlay"><div class="time reveal">03:17</div><div class="outro-black"></div></div>`;return base(scene,scene.label)}
      function palette(scene){return scene.start<396.4?"hospital":scene.start<698.48?"cctv":"taxi"}
      function sceneMarkup(scene){if(scene.end<=OFFSET||(OFFSET>0&&scene.start>=OFFSET+360))return "";const imgs=scene.visuals.map((n,i)=>`<img class="scene-image" data-i="${i}" src="${A+n}.png" alt="">`).join("");const s=Math.max(0,scene.start-OFFSET),e=Math.max(s,scene.end-OFFSET);return `<section id="scene-${scene.id}" class="scene clip palette-${palette(scene)}" data-start="${s}" data-duration="${Math.max(.05,e-s)}">${imgs}${overlay(scene)}<div class="scrim"></div><div class="color-cast"></div><div class="grain"></div><div class="scan"></div><div class="pulse"></div></section>`}
      document.getElementById("scene-host").innerHTML=window.HF_SCENES.map(sceneMarkup).join("");window.__timelines=window.__timelines||{};const tl=gsap.timeline({paused:true,defaults:{ease:"power2.out"}});tl.set(".progress",{scaleX:0},0).to(".progress",{scaleX:1,duration:DURATION,ease:"none"},0);
      window.HF_SCENES.forEach((scene,si)=>{const el=document.getElementById(`scene-${scene.id}`);if(!el)return;const images=Array.from(el.querySelectorAll(".scene-image"));const s=Math.max(0,scene.start-OFFSET),e=Math.max(s,scene.end-OFFSET),d=e-s,slot=d/Math.max(1,images.length);tl.set(el,{autoAlpha:1},s);if(scene.overlay!=="outro")tl.fromTo(el,{filter:"brightness(.96)"},{filter:"brightness(1.04)",duration:1.4,yoyo:true,repeat:Math.max(1,Math.ceil(d/1.4)),ease:"sine.inOut"},s);images.forEach((img,i)=>{const vs=s+i*slot,dir=(si+i)%2?1:-1;tl.set(img,{autoAlpha:i===0?1:0},s);if(i>0)tl.to(img,{autoAlpha:1,duration:.65,ease:"power1.inOut"},vs);tl.fromTo(img,{scale:1.08+i*.02,xPercent:-2*dir,yPercent:(i%3)-1,filter:"saturate(.66) contrast(1.18) brightness(.62)"},{scale:1.2+i*.02,xPercent:2.2*dir,yPercent:1-(i%3),filter:"saturate(.82) contrast(1.1) brightness(.78)",duration:slot+.2,ease:"none"},vs);if(i<images.length-1)tl.to(img,{autoAlpha:0,duration:.65},vs+slot-.65)});el.querySelectorAll(".reveal").forEach((n,i)=>tl.fromTo(n,{autoAlpha:0,y:18},{autoAlpha:1,y:0,duration:.55},s+.08+Math.min(i*1.15,Math.max(.1,d-1))));const scan=el.querySelector(".scan"),pulse=el.querySelector(".pulse"),cast=el.querySelector(".color-cast");tl.to(cast,{xPercent:si%2?18:-18,duration:Math.max(.05,d),ease:"sine.inOut"},s);for(let t=2.5,n=0;t<d-.35;t+=2.8,n++){tl.fromTo(scan,{autoAlpha:0,y:0},{autoAlpha:.66,y:1200,duration:1.15,ease:"none"},s+t);tl.fromTo(pulse,{autoAlpha:.58,scale:.2,x:180+(n*317)%1500,y:120+(n*191)%700},{autoAlpha:0,scale:3.4,duration:1.4,ease:"sine.out"},s+t+.25)}
        if(scene.overlay==="chapter")tl.to(el.querySelector(".chapter-line"),{width:"54%",duration:1.4},s+.5);if(scene.overlay==="phone"||scene.overlay==="identity"||scene.overlay==="radio")el.querySelectorAll(".wave i").forEach((b,i)=>tl.fromTo(b,{scaleY:.18,autoAlpha:.18},{scaleY:1,autoAlpha:.78,duration:.22,yoyo:true,repeat:7},s+2+(i%13)*.09));if(scene.overlay==="elevator"){el.querySelectorAll(".floor").forEach((n,i)=>tl.fromTo(n,{autoAlpha:.2,x:30},{autoAlpha:1,x:0,duration:.35},s+1+i*.9));tl.fromTo(el.querySelector(".track"),{scaleX:0},{scaleX:1,duration:4},s+5)}if(scene.overlay==="blackout")el.querySelectorAll(".light").forEach((n,i)=>tl.to(n,{autoAlpha:.05,duration:.12},s+3+i*.55));if(scene.overlay==="identity")tl.fromTo(el.querySelector(".cursor"),{autoAlpha:0},{autoAlpha:1,duration:.25,yoyo:true,repeat:Math.max(2,Math.floor(d*2))},s+.5);if(scene.overlay==="call"){const c=el.querySelector(".call-card");for(let t=1;t<d-1;t+=2.2)tl.fromTo(c,{boxShadow:"0 0 30px rgba(255,64,87,.1)"},{boxShadow:"0 0 90px rgba(255,64,87,.55)",duration:.22,yoyo:true,repeat:1},s+t)}if(scene.overlay==="transition")tl.fromTo(el.querySelector(".transition-ring"),{scale:.2,autoAlpha:1},{scale:5,autoAlpha:0,duration:Math.max(.2,d),ease:"power2.in"},s);if(scene.overlay==="footprints")el.querySelectorAll(".step").forEach((n,i)=>tl.to(n,{autoAlpha:1,duration:.18},s+2+i*.75));if(scene.overlay==="delay")tl.to(el.querySelectorAll(".delay-card")[0],{x:70,duration:Math.max(2,d*.65),ease:"none"},s+2);if(scene.overlay==="door")el.querySelectorAll(".lock").forEach((n,i)=>tl.to(n,{color:"#ff4057",borderColor:"#ff4057",duration:.22},s+2+i*1.1));if(scene.overlay==="loop"){const p=el.querySelector(".route-path"),len=2500;tl.set(p,{strokeDasharray:len,strokeDashoffset:len},s).to(p,{strokeDashoffset:0,duration:7,ease:"power1.inOut"},s+.6)}if(scene.overlay==="homecall")tl.fromTo(el.querySelector(".phone-ui"),{rotation:-1},{rotation:1,duration:.09,yoyo:true,repeat:9},s+4);if(scene.overlay==="tunnel")tl.to(el.querySelector(".tunnel-strip"),{x:-620,duration:Math.max(3,d-3),ease:"none"},s+1.5);if(scene.overlay==="empty")tl.fromTo(el.querySelector(".wet-arrow"),{scaleX:0},{scaleX:1,duration:2.6},s+2);if(scene.overlay==="ending")tl.fromTo(el.querySelector(".ending-line"),{scaleX:0},{scaleX:1,duration:3},s+5);if(scene.overlay==="outro")tl.to(el.querySelector(".outro-black"),{autoAlpha:1,duration:Math.max(.2,d),ease:"power1.in"},s);tl.to(el,{autoAlpha:0,duration:Math.min(.35,d*.5)},Math.max(s,e-Math.min(.35,d*.5))).set(el,{visibility:"hidden"},e)});
      tl.to({}, {duration:.001}, Math.max(.001,DURATION-OFFSET));window.__timelines["youtube-master"]=tl;
