<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>거울 속 저는 계속 달렸다 · Shorts</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="shorts-transcript-data.js"></script>
  <style>
    @font-face{font-family:AppleSD;src:local("Apple SD Gothic Neo")}
    *{box-sizing:border-box}html,body{margin:0;background:#010305;font-family:AppleSD,Arial,sans-serif}
    #shorts{position:relative;width:1080px;height:1920px;overflow:hidden;color:#fff;background:#010305}
    .image{position:absolute;inset:-80px;background:url('assets/visuals/shorts-gym.png') center/cover;filter:saturate(.75) contrast(1.12) brightness(.7)}
    .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,2,5,.82),rgba(0,2,5,.05) 30%,rgba(0,2,5,.88))}
    .kicker{position:absolute;left:70px;top:90px;font-size:26px;font-weight:900;letter-spacing:.2em;color:#79ddd4}
    .headline{position:absolute;left:70px;right:70px;top:150px;font-size:72px;line-height:1.12;font-weight:950;letter-spacing:-.045em}
    .headline em{font-style:normal;color:#ff334f}
    .caption-wrap{position:absolute;left:56px;right:56px;bottom:230px;text-align:center}
    .caption{font-size:44px;line-height:1.32;font-weight:900;letter-spacing:-.03em;-webkit-text-stroke:5px #000;paint-order:stroke fill}
    .progress{position:absolute;left:70px;right:70px;bottom:160px;height:7px;background:rgba(255,255,255,.16)}
    .progress i{display:block;height:100%;width:0;background:#ff334f}
  </style>
</head>
<body>
  <div id="shorts" data-composition-id="shorts-master" data-start="0" data-width="1080" data-height="1920" data-duration="16.54">
    <audio id="shorts-audio" data-start="0" data-duration="16.54" data-track-index="0" src="assets/audio/shorts-summary.wav" data-volume="1"></audio>
    <div class="image"></div>
    <div class="shade"></div>
    <div class="kicker">GYM MIRROR</div>
    <div class="headline">거울 속 저는<br><em>계속 달렸다</em></div>
    <div class="caption-wrap"><div class="caption"></div></div>
    <div class="progress"><i></i></div>
  </div>
  <script>
    const duration=16.54;
    const tl=gsap.timeline({paused:true});
    window.__timelines=window.__timelines||{};
    window.__timelines["shorts-master"]=tl;
    tl.fromTo(".image",{scale:1.08,y:0},{scale:1.16,y:-30,duration,ease:"none"},0);
    tl.fromTo(".progress i",{width:"0%"},{width:"100%",duration,ease:"none"},0);
    (window.HF_CAPTIONS?.cues||[]).forEach(cue=>{
      tl.set(".caption",{innerText:cue.text,autoAlpha:1},cue.start);
      tl.set(".caption",{autoAlpha:0},Math.min(duration,cue.end+0.04));
    });
  </script>
</body>
</html>
