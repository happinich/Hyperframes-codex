          <div class="card metric-card">
            <div class="metric ${index === 0 ? "gold" : index === 1 ? "blue" : "mint"}">${item[0]}</div>
            <div class="label">${item[1]}</div>
          </div>
        `).join("")}</div>`;
      }

      function visual(scene) {
        if (scene.visual === "map") {
          return `<div class="map scene-visual">
            <div class="river"></div>
            <div class="district hot" style="left: 47%; top: 54%;">강남구<br><span class="mini">3,706억</span></div>
            <div class="district" style="left: 66%; top: 48%;">송파구<br><span class="mini">3,531억</span></div>
            <div class="district" style="left: 31%; top: 55%;">서초구<br><span class="mini">2,903억</span></div>
            <div class="district" style="left: 42%; top: 20%;">서울 65.5%</div>
          </div>`;
        }
        if (scene.visual === "bars") {
          return `<div class="card scene-visual">
            <h2 style="font-size:54px;">자금 유입 비교</h2>
            <div class="barset">
              <div class="bar"><span>강남구</span><div class="track"><div class="fill" data-width="1" style="width:100%"></div></div><span>3,706억</span></div>
              <div class="bar"><span>송파구</span><div class="track"><div class="fill" data-width=".95" style="width:95%"></div></div><span>3,531억</span></div>
              <div class="bar"><span>서초구</span><div class="track"><div class="fill" data-width=".78" style="width:78%"></div></div><span>2,903억</span></div>
            </div>
            <div class="spark" style="left:70%;top:54%;"></div>
          </div>`;
        }
        if (scene.visual === "tower") {
          return `<div class="card scene-visual">
            <div class="tower"><div class="building"></div><div class="building"></div><div class="building"></div></div>
            <div class="chips"><span class="chip">오피스</span><span class="chip">호텔</span><span class="chip">전시장</span><span class="chip">공연장</span><span class="chip">도심숲</span></div>
          </div>`;
        }
        if (scene.visual === "hub") {
          return `<div class="axis scene-visual">
            <div class="connector" style="transform: rotate(-138deg);"></div>
            <div class="connector" style="transform: rotate(-42deg);"></div>
            <div class="connector" style="transform: rotate(138deg);"></div>
            <div class="connector" style="transform: rotate(42deg);"></div>
            <div class="connector" style="transform: rotate(90deg); width:210px;"></div>
            <div class="hub">삼성역<br>허브</div>
            <div class="point" style="left:7%;top:9%;">GTX-A</div>
            <div class="point" style="right:7%;top:9%;">GTX-C</div>
            <div class="point" style="left:3%;bottom:14%;">2호선</div>
            <div class="point" style="right:3%;bottom:14%;">9호선</div>
            <div class="point" style="left:50%;bottom:0;transform:translateX(-50%);">위례신사선</div>
          </div>`;
        }
        if (scene.visual === "river") {
          return `<div class="map scene-visual">
            <div class="river"></div>
            <div class="district hot" style="left:16%;top:46%;">압구정 2구역</div>
            <div class="district hot" style="left:36%;top:40%;">3구역</div>
            <div class="district hot" style="left:54%;top:46%;">4구역</div>
            <div class="district hot" style="left:70%;top:39%;">5구역</div>
            <div class="district" style="left:34%;top:18%;">한강변 스카이라인</div>
          </div>`;
        }
        if (scene.visual === "risk") {
          return `<div class="card scene-visual">
            <h2 style="font-size:54px;">리스크 체크</h2>
            <div class="risk">
              <div>금리</div><div>세금</div><div>대출 규제</div><div>토지거래허가</div><div>재건축 속도</div><div>경기 둔화</div>
            </div>
          </div>`;
        }
        if (scene.visual === "axis") {
          return `<div class="axis scene-visual">
            <div class="connector" style="transform: rotate(-138deg);"></div>
            <div class="connector" style="transform: rotate(-42deg);"></div>
            <div class="connector" style="transform: rotate(138deg);"></div>
            <div class="connector" style="transform: rotate(42deg);"></div>
            <div class="hub">강남<br>4축</div>
            <div class="point" style="left:8%;top:10%;">삼성<br><span class="mini">교통·업무</span></div>
            <div class="point" style="right:8%;top:10%;">압구정<br><span class="mini">한강 재건축</span></div>
            <div class="point" style="left:8%;bottom:12%;">대치<br><span class="mini">학군</span></div>
            <div class="point" style="right:8%;bottom:12%;">개포<br><span class="mini">신축 수요</span></div>
          </div>`;
        }
        return `<div class="flow scene-visual">
          <div class="node flow-step" style="left:0;top:92px;">주식<br>수익</div>
          <div class="arrow" style="left:174px;top:160px;width:108px;"></div>
          <div class="node flow-step" style="left:312px;top:92px;">현금</div>
          <div class="arrow" style="left:486px;top:160px;width:92px;"></div>
          <div class="node big flow-destination" style="left:604px;top:52px;">강남<br>부동산</div>
          <div class="node flow-caption" style="left:236px;bottom:58px;">돈의 목적지 변화</div>
        </div>`;
      }

      document.getElementById("scenes").innerHTML = scenes.map((scene) => `
        <section class="scene" id="${scene.id}">
          <div class="panel two">
            <div>
              <div class="kicker">${scene.kicker}</div>
              <h1 class="${titleClass(scene.title)}">${scene.title.replace(/\n/g, "<br>")}</h1>
              <p class="sub">${scene.sub}</p>
              <div class="chips">${scene.metrics.map((item) => `<span class="chip">${item[0]}</span>`).join("")}</div>
            </div>
            <div>
              ${visual(scene)}
            </div>
          </div>
        </section>
      `).join("");

      window.__timelines = window.__timelines || {};
      function titleClass(title) {
        const length = title.replace(/\s|\n/g, "").length;
        if (length >= 20) return "long-title";
        if (length >= 15) return "compact-title";
        return "";
      }
      const tl = gsap.timeline({ paused: true });
      function toTargets(selector, vars, at) {
        if (document.querySelector(selector)) tl.to(selector, vars, at);
      }
      function fromToTargets(selector, fromVars, toVars, at) {
        if (document.querySelector(selector)) tl.fromTo(selector, fromVars, toVars, at);
      }
      tl.to(".sheen", { x: 360, y: 120, rotation: 7, duration: 379.965, ease: "none" }, 0);
      tl.to(".grid", { backgroundPosition: "380px 260px", duration: 379.965, ease: "none" }, 0);
      tl.fromTo(".money-band:not(.two)", { x: -160 }, { x: 7600, duration: 379.965, ease: "none" }, 0);
      tl.fromTo(".money-band.two", { x: 4260 }, { x: -6200, duration: 379.965, ease: "none" }, 0);
      tl.to(".pulse-orb", { x: -1550, y: -680, scale: 1.6, rotation: 360, duration: 379.965, ease: "none" }, 0);
      tl.to(".motion-rail", { backgroundPosition: "4200px 0", duration: 379.965, ease: "none" }, 0);
      scenes.forEach((scene) => {
        const duration = scene.end - scene.start;
        const element = `#${scene.id}`;
        tl.set(element, { autoAlpha: 1 }, scene.start);
        tl.fromTo(`${element} .panel`, { y: 36, scale: .99 }, { y: 0, scale: 1, duration: .55, ease: "power3.out" }, scene.start);
        tl.fromTo(`${element} h1`, { y: 28, opacity: 0 }, { y: 0, opacity: 1, duration: .48, ease: "power3.out" }, scene.start + .08);
        tl.fromTo(`${element} .sub`, { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: .42, ease: "power3.out" }, scene.start + .22);
        tl.fromTo(`${element} .scene-visual`, { x: 24, opacity: 0 }, { x: 0, opacity: 1, duration: .35, ease: "power3.out" }, scene.start + .02);
        fromToTargets(`${element} .metric-card, ${element} .chip, ${element} .district, ${element} .point, ${element} .building, ${element} .node`, { y: 18, opacity: .45 }, {
          y: 0,
          opacity: 1,
          stagger: .08,
          duration: .7,
          ease: "power2.out"
        }, scene.start + .22);
        tl.to(`${element} .scene-visual`, { y: -28, duration: Math.max(duration - .8, .5), ease: "none" }, scene.start + .42);
        toTargets(`${element} .hub`, {
          rotation: 6,
          scale: 1.035,
          duration: Math.max(duration - 1.2, .5),
          ease: "sine.inOut"
        }, scene.start + .6);
        toTargets(`${element} .fill`, {
          scaleX: .88,
          yoyo: true,
          repeat: Math.max(1, Math.floor(duration / 2.2)),
          duration: 1.1,
          stagger: .12,
          ease: "sine.inOut"
        }, scene.start + .5);
        toTargets(`${element} .spark`, {
          x: 280,
          opacity: .25,
          yoyo: true,
          repeat: Math.max(1, Math.floor(duration / 1.6)),
          duration: .8,
          ease: "sine.inOut"
        }, scene.start + .6);
        toTargets(`${element} .point`, {
          x: (index) => (index % 2 === 0 ? 14 : -14),
          y: (index) => (index % 2 === 0 ? -10 : 10),
          yoyo: true,
          repeat: Math.max(1, Math.floor(duration / 2.4)),
          duration: 1.2,
          stagger: .1,
          ease: "sine.inOut"
        }, scene.start + .6);
        fromToTargets(`${element} .connector`, { scaleX: .18, opacity: .18 }, {
          scaleX: 1,
          opacity: .72,
          yoyo: true,
          repeat: Math.max(1, Math.floor(duration / 2)),
          duration: 1.0,
          stagger: .08,
          ease: "sine.inOut"
        }, scene.start + .45);
        toTargets(`${element} .node`, {
          x: (index) => (index % 2 === 0 ? 16 : -16),
          yoyo: true,
          repeat: Math.max(1, Math.floor(duration / 2.6)),
          duration: 1.3,
          stagger: .12,
          ease: "sine.inOut"
        }, scene.start + .55);
        toTargets(`${element} .district`, {
          scale: 1.035,
          yoyo: true,
          repeat: Math.max(1, Math.floor(duration / 2.4)),
          duration: 1.2,
          stagger: .12,
          ease: "sine.inOut"
        }, scene.start + .55);
        toTargets(`${element} .building`, {
          scaleY: 1.05,
          yoyo: true,
          repeat: Math.max(1, Math.floor(duration / 2.2)),
          duration: 1.1,
          stagger: .14,
          transformOrigin: "bottom center",
          ease: "sine.inOut"
        }, scene.start + .6);
        tl.to(element, { autoAlpha: 0, duration: .35, ease: "power2.in" }, Math.max(scene.end - .35, scene.start + .1));
      });
      window.__timelines["youtube-master"] = tl;
    </script>
  </body>
</html>
